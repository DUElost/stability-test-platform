version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: cron
      cronjob: "0 4 * * *"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
    open-pull-requests-limit: 10
    ignore:
      # 所有在 requirements.txt 里刻意封顶的包（#385：只 ignore 5/27 时，
      # 其余包 major 发布仍会被 widen 策略撑宽，重演 #242 的抖动；
      # cooldown 只降频不治本）。ignore 下限与 manifest 上限对齐，
      # update-types 限定为 semver-major 版本更新，安全更新 PR 不受影响
      # （versions 静态区间会抑制对应版本的安全 PR，故两类都写）。
      - dependency-name: "redis"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "paramiko"
        versions: [">=4.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "psutil"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "bcrypt"
        versions: [">=5.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "croniter"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "saq"
        versions: [">=1.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        versions: [">=1.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "uvicorn"
        versions: [">=1.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "requests"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "aiohttp"
        versions: [">=4.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "asyncssh"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "prometheus-client"
        versions: [">=1.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyjwt"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyasn1"
        versions: [">=0.7"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "passlib"
        versions: [">=2.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "asyncpg"
        versions: [">=1.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "aiosqlite"
        versions: [">=1.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "alembic"
        versions: [">=2.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsonschema"
        versions: [">=5.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "apscheduler"
        versions: [">=5.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "python-socketio"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "httpx"
        versions: [">=1.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "xlrd"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: cron
      cronjob: "0 4 * * *"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint 8.x 的 peer 上限是 typescript<6.1；TS 的
      # semver-major 版本更新需人工迁移（#243 的 ERESOLVE 根因）。
      # update-types 限定只作用于版本更新，安全更新不受影响。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # minor/patch 走自动合入；major（react 19 / tailwind 4 / eslint 10
      # 等迁移）单独成 PR，人工评审。
      frontend-patch-minor:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      frontend-major:
        patterns:
          - "*"
        update-types: ["major"]

  # actions 仍按 SHA 固定；本生态让 Dependabot 自动跟进安全/版本更新，
  # 更新 PR **排除 auto-merge、人工评审**（enable-auto-merge.yml 按分支前缀
  # 排除：轻量门禁对 action 内容零检测力，job 级写权限放大投毒后果）。
  # cooldown 官方语义：同一依赖的 PR 合并/关闭后 30 天内不再开新的版本更新
  # PR；安全更新不受 cooldown 约束。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 4 * * *"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
