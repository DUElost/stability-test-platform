version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # 这些包在 requirements.txt 里刻意封顶（redis<6.0 另受 saq[redis]<8
      # 约束）。ignore 下限与 manifest 上限对齐，防止 Dependabot 的 pip
      # widen 策略扩过封顶（#242 的 ResolutionImpossible 即由此而来）；
      # update-types 限定为 semver-major 版本更新，安全更新 PR 不受影响。
      - dependency-name: "redis"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "paramiko"
        versions: [">=4.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "psutil"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "bcrypt"
        versions: [">=5.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "croniter"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint 8.x 的 peer 上限是 typescript<6.1；TS 的
      # semver-major 版本更新需人工迁移（#243 的 ERESOLVE 根因）。
      # update-types 限定只作用于版本更新，安全更新不受影响。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jsdom 30 依赖 undici 7，需要 Node 22+（CI/本地为 Node 20）；锁在 26.x，
      # 等 CI 升 Node 22 后再放开 major。
      - dependency-name: "jsdom"
        versions: [">=27.0"]
        update-types: ["version-update:semver-major"]
    groups:
      # minor/patch 走自动合入；major（react 19 / tailwind 4 / eslint 10
      # 等迁移）单独成 PR，人工评审。
      frontend-patch-minor:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      frontend-major:
        patterns:
          - "*"
        update-types: ["major"]
