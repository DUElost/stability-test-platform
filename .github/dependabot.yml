version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # 这些包在 requirements.txt 里刻意封顶（redis<6.0 另受 saq[redis]<8
      # 约束）。ignore 下限与 manifest 上限对齐，防止 Dependabot 的 pip
      # widen 策略扩过封顶（#242 的 ResolutionImpossible 即由此而来）；
      # update-types 限定为 semver-major 版本更新，安全更新 PR 不受影响。
      - dependency-name: "redis"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "paramiko"
        versions: [">=4.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "psutil"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "bcrypt"
        versions: [">=5.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "croniter"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-deps:
        patterns:
          - "*"
