version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: cron
      cronjob: "0 4 * * *"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
    open-pull-requests-limit: 10
    ignore:
      # 这些包在 requirements.txt 里刻意封顶（redis<6.0 另受 saq[redis]<8
      # 约束）。ignore 下限与 manifest 上限对齐，防止 Dependabot 的 pip
      # widen 策略扩过封顶（#242 的 ResolutionImpossible 即由此而来）；
      # update-types 限定为 semver-major 版本更新，安全更新 PR 不受影响。
      - dependency-name: "redis"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "paramiko"
        versions: [">=4.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "psutil"
        versions: [">=6.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "bcrypt"
        versions: [">=5.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "croniter"
        versions: [">=3.0"]
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: cron
      cronjob: "0 4 * * *"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint 8.x 的 peer 上限是 typescript<6.1；TS 的
      # semver-major 版本更新需人工迁移（#243 的 ERESOLVE 根因）。
      # update-types 限定只作用于版本更新，安全更新不受影响。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # minor/patch 走自动合入；major（react 19 / tailwind 4 / eslint 10
      # 等迁移）单独成 PR，人工评审。
      frontend-patch-minor:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      frontend-major:
        patterns:
          - "*"
        update-types: ["major"]

  # actions 仍按 SHA 固定；本生态让 Dependabot 自动跟进安全/版本更新，
  # 更新 PR 必须过现有轻量门禁才会被 auto-merge，夜间全量 CI 再复验。
  # cooldown 只作用于版本更新，安全更新不受影响。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 4 * * *"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
