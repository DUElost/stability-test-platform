name: Enable auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  pull_request_review:
    # submitted + dismissed：撤销评审必须触发门禁重算，否则旧 APPROVED 会
    # 残留 success。成对触发产生的多余运行由 concurrency + 最终守卫收敛。
    types: [submitted, dismissed]
  # status：CodeRabbit 的 commit status 变化（如 rate limited 落地）不伴随
  # review 事件，但没有它，gate 写 pending 后（复评排队中）若只有 CR 的
  # status 变化，pending 将永远停留。job 级 if 只放行 CodeRabbit context，
  # 本 workflow 自写的 code-rabbit-gate status 不会自我触发。
  status:

# 并发键统一按 HEAD sha（PR 事件取 head.sha，status 事件取 commit sha）：
# 同一 head 的所有事件共享一个组，避免 PR 事件 run 与 status 事件 run
# 分组不同而互相竞写状态（#268 CR 意见）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.event.sha }}
  cancel-in-progress: true

# 不给整个 workflow 写权限；各 job 单独声明最小权限。
permissions:
  {}

jobs:
  enable-auto-merge:
    # 仅同仓库、非 draft PR：fork PR 的 GITHUB_TOKEN 只读，且不应获得自动合入
    # 能力。以下 Dependabot PR 不挂 auto-merge，交由人工评审后再合入：
    # - frontend-major（react 19 / tailwind 4 / eslint 10 等迁移）；
    # - github_actions（CI 执行代码的第三方替换；轻量门禁对其内容零检测力，
    #   job 级写权限放大投毒后果，人工看一行 SHA diff 成本近零，#267 评审意见）。
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name && !startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/frontend/frontend-major-') && !startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    # gh pr merge --auto --merge 需要 PR 与 base 分支的写权限，job 内按需授予。
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          method="$(
            gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){autoMergeRequest{mergeMethod}}}}' \
              -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.autoMergeRequest.mergeMethod // ""'
          )"
          if [ "$method" != "MERGE" ]; then
            gh pr merge "$PR_URL" --auto --merge
          fi

  merge-gate:
    # best-effort 参考门禁：CodeRabbit 对当前 head 的 APPROVED → success；对当前
    # head 的 CHANGES_REQUESTED → failure；rate limited / skipped / paused / 当前
    # head 无决策 → success（由 required checks 把关，CodeRabbit 不因配额/不可用
    # 阻塞合入）；dependabot[bot] PR 若无 CodeRabbit 终态决策也放行（实测 bot PR
    # 不触发 CodeRabbit 审查，否则 code-rabbit-gate 会永久 pending 卡死自动合入）。
    # auto_incremental_review 关闭后 push 常出现 skipped/paused，属预期常态而非
    # 合入阻断项；旧 commit 的 CHANGES_REQUESTED 不作为当前 head 的阻断决策。
    # job 名刻意不用 code-rabbit-gate，避免 job check run 与 required commit
    # status 同名，造成 required check 来源歧义。
    # 非 status 事件沿用 PR 条件；status 事件仅 CodeRabbit context 放行
    # （否则每次 commit status 更新都会触发一次运行）。
    if: (github.event_name != 'status' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) || (github.event_name == 'status' && github.event.context == 'CodeRabbit')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Set code-rabbit-gate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.sha }}
        run: |
          set -euo pipefail

          # status 事件：CodeRabbit 的 commit status 变化（rate limited /
          # skipped / completed 等）不伴随 review 事件，从这里重算 gate。
          # commit → open PR 反查；无 open PR 或查询失败则退出不写状态。
          if [ "$EVENT_NAME" = "status" ]; then
            PR_NUMBER="$(
              gh api "repos/$REPO_OWNER/$REPO_NAME/commits/$HEAD_SHA/pulls" \
                --jq '[.[] | select(.state == "open")][0].number // 0'
            )" || { echo "PR lookup failed; skip"; exit 0; }
            if [ "$PR_NUMBER" = "0" ]; then
              echo "No open PR for $HEAD_SHA; skip"
              exit 0
            fi
          fi

          set_status() {
            local state="$1" desc="$2"
            gh api -X POST "repos/$REPO_OWNER/$REPO_NAME/statuses/$HEAD_SHA" \
              -f state="$state" -f context=code-rabbit-gate -f description="$desc" >/dev/null
          }
          latest_review() {
            gh api --paginate --slurp "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER/reviews" \
              | jq -c --arg head_sha "$HEAD_SHA" \
                  '[.[][] | select(.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") | select(.commit_id == $head_sha)] | sort_by(.id) | .[-1] | {id: (.id // 0), state: (.state // "")}'
          }
          review_by_id() {
            # 评审事件专用：精确匹配 REVIEW_ID 且 commit_id 等于当前 HEAD 的评审。
            gh api --paginate --slurp "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER/reviews" \
              | jq -c --arg head_sha "$HEAD_SHA" --arg id "$REVIEW_ID" \
                  '[.[][] | select(.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") | select(.commit_id == $head_sha and ((.id // 0) | tostring) == $id)] | .[0] | {id: (.id // 0), state: (.state // "")}'
          }
          head_decision() {
            # HEAD 绑定决策：只取 CodeRabbit 对当前 head commit 的
            # APPROVED / CHANGES_REQUESTED / DISMISSED（COMMENTED 不构成决策），
            # 取 ID 最大的那条。DISMISSED 视为清除性终态：撤销后即使更早存在
            # APPROVED 也不放行。关闭增量审查后，旧 commit 的批准不能放行新 head。
            gh api --paginate --slurp "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER/reviews" \
              | jq -c --arg head_sha "$HEAD_SHA" \
                  '[.[][] | select(.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") | select(.commit_id == $head_sha) | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] | sort_by(.id) | .[-1] | {id: (.id // 0), state: (.state // "")}'
          }
          guard_before_success() {
            # 所有非评审 success 写入前的最终并发守卫（#268 CR 意见）：
            # 前面任何查询之后都可能落入新的 CHANGES_REQUESTED 评审，或同一
            # head 已有更新的 run 在写状态；cancel-in-progress 是异步的，
            # 旧 run 不得覆盖新状态。查询失败一律写 pending 而非静默退出
            # （set -e 下终止会残留旧 success 放行）。
            local state newest_run_id head_json
            if ! head_json="$(head_decision)"; then
              set_status pending "CodeRabbit gate query failed"
              exit 0
            fi
            state="$(printf '%s' "$head_json" | jq -r .state)"
            if [ "$state" = "CHANGES_REQUESTED" ]; then
              set_status failure "CodeRabbit requested changes"
              exit 0
            fi
            newest_run_id="$(
              gh api "repos/$REPO_OWNER/$REPO_NAME/actions/workflows/enable-auto-merge.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
                --jq '[.workflow_runs[]][0].id // 0'
            )" || {
              set_status pending "CodeRabbit gate query failed"
              exit 0
            }
            if [ "$newest_run_id" != "0" ] && [ "$newest_run_id" != "$GITHUB_RUN_ID" ]; then
              echo "Superseded by newer run $newest_run_id; skip status write"
              exit 0
            fi
          }

          # 评审提交事件：仅处理 CodeRabbit 的评审；人工评审事件直接跳过。
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            if [ "$REVIEW_AUTHOR" != "coderabbitai[bot]" ] && [ "$REVIEW_AUTHOR" != "coderabbitai" ]; then
              echo "Review by ${REVIEW_AUTHOR:-unknown}; merge-gate skipped"
              exit 0
            fi
            # REST 可能稍后才能看到刚提交的评审；仅当 id 与 REVIEW_ID 对齐才结束
            # 重试（最多 60 秒），避免旧评审状态提前结束循环导致误写 success。
            state=""
            id=""
            for _ in $(seq 1 12); do
              if ! review_json="$(review_by_id)"; then
                set_status pending "CodeRabbit gate query failed"
                exit 0
              fi
              id="$(printf '%s' "$review_json" | jq -r .id)"
              state="$(printf '%s' "$review_json" | jq -r .state)"
              [ "$id" = "$REVIEW_ID" ] && break
              sleep 5
            done
            if [ "$id" != "$REVIEW_ID" ]; then
              set_status pending "CodeRabbit review pending"
              exit 0
            fi
            # 最终守卫：cancel-in-progress 是异步取消，旧运行仍可能在取消完成前
            # 写状态。写入前确认 REVIEW_ID 仍是该 HEAD 上最新的 CodeRabbit 评审，
            # 且本运行未被更新的运行取代；否则退出，由新运行写状态。
            if ! latest="$(latest_review)"; then
              set_status pending "CodeRabbit gate query failed"
              exit 0
            fi
            latest_id="$(printf '%s' "$latest" | jq -r .id)"
            if [ "$latest_id" != "0" ] && [ "$latest_id" != "$REVIEW_ID" ]; then
              echo "Newer review $latest_id supersedes $REVIEW_ID; skip status write"
              exit 0
            fi
            newest_run_id="$(
              gh api "repos/$REPO_OWNER/$REPO_NAME/actions/workflows/enable-auto-merge.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
                --jq '[.workflow_runs[]][0].id // 0'
            )" || {
              set_status pending "CodeRabbit gate query failed"
              exit 0
            }
            if [ "$newest_run_id" != "0" ] && [ "$newest_run_id" != "$GITHUB_RUN_ID" ]; then
              echo "Superseded by newer run $newest_run_id; skip status write"
              exit 0
            fi
            case "$state" in
              APPROVED) set_status success "CodeRabbit approved" ;;
              CHANGES_REQUESTED) set_status failure "CodeRabbit requested changes" ;;
              *)
                # COMMENTED 等非终态评审不清除既有 head 决策。
                if ! head_json="$(head_decision)"; then
                  set_status pending "CodeRabbit gate query failed"
                  exit 0
                fi
                head_state="$(printf '%s' "$head_json" | jq -r .state)"
                case "$head_state" in
                  APPROVED) set_status success "CodeRabbit approved" ;;
                  CHANGES_REQUESTED) set_status failure "CodeRabbit requested changes" ;;
                  DISMISSED) set_status pending "CodeRabbit review dismissed" ;;
                  *) set_status pending "CodeRabbit review pending" ;;
                esac
                ;;
            esac
            exit 0
          fi

          # 非评审事件：HEAD 绑定决策决定门禁。旧 commit 的终态决策不参与，
          # 需 CodeRabbit 对当前 head 复评后才能放行或阻断。
          if ! head_json="$(head_decision)"; then
            set_status pending "CodeRabbit gate query failed"
            exit 0
          fi
          head_state="$(printf '%s' "$head_json" | jq -r .state)"
          if [ "$head_state" = "CHANGES_REQUESTED" ]; then
            set_status failure "CodeRabbit requested changes"
            exit 0
          fi
          if [ "$head_state" = "APPROVED" ]; then
            set_status success "CodeRabbit approved"
            exit 0
          fi

          # 等 CodeRabbit 在该 commit 上的状态落定（最多 10 分钟）：
          # queued / in progress → 继续等；rate limited / skipped / paused /
          # completed / 其他 → 停止轮询。
          desc=""
          for _ in $(seq 1 60); do
            desc="$(
              gh api "repos/$REPO_OWNER/$REPO_NAME/commits/$HEAD_SHA/status" \
                --jq '[.statuses[] | select(.context == "CodeRabbit")][0].description // ""'
            )"
            if [ -n "$desc" ] && ! printf '%s' "$desc" | grep -qiE 'queued|in.progress'; then
              break
            fi
            sleep 10
          done

          # Dependabot 安全/版本更新 PR：CodeRabbit 通常不审查 bot PR（实测 head
          # 上无任何 CodeRabbit status/check）。只要没有 CHANGES_REQUESTED 终态
          # 决策就放行，由 CI/CodeQL 等 required checks 把关，避免 code-rabbit-gate
          # 永久 pending。若 CodeRabbit 真的 request changes，仍按失败处理。
          if [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            guard_before_success
            set_status success "Dependabot PR; required checks gate merge"
            exit 0
          fi

          if [ -z "$desc" ] || printf '%s' "$desc" | grep -qiE 'queued|in.progress'; then
            set_status pending "Waiting for CodeRabbit review or rate-limit decision"
            exit 0
          fi
          if printf '%s' "$desc" | grep -qi 'rate.limit'; then
            guard_before_success
            set_status success "CodeRabbit rate limited; required checks gate merge"
            exit 0
          fi
          # skipped / paused 通常放行（配额/不可用不阻塞）。但若本 PR 历史上有
          # 未撤销的 CodeRabbit CHANGES_REQUESTED（任意 commit），说明存在待复评
          # 状态：此时 skipped 可能只是「手动复评还在排队」（#267 实测：复评落定
          # 前 gate 已按 skipped 放行，合入 5 分钟后 CR 才给出终态）。此类 PR 必须
          # 等 CR 对当前 head 给出终态（review 事件会写 gate）或明确 rate limited
          # 才放行，skipped/paused 一律 pending。
          # 逃生阀：dismiss 旧 review（state 不再是 CHANGES_REQUESTED）后，任意
          # pull_request 事件重跑本路径会**重新评估**（并非无条件放行）：当前
          # head 仍有 CHANGES_REQUESTED → failure；无终态 → pending；仅历史与
          # 当前 head 都干净且状态 skipped/paused 时才 success。CR 的 commit
          # status 变化（rate limited 等）经 status 事件同样重算本路径。
          if printf '%s' "$desc" | grep -qiE 'skipped|paused'; then
            # 查询失败必须写 pending 而非静默退出：set -e 下 gh/jq 失败会让
            # 步骤直接终止，已存在的旧 success 会继续放行（#268 CR 意见）。
            if ! prior_cr="$(
              gh api --paginate --slurp "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER/reviews" \
                | jq '[.[][] | select(.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") | select(.state == "CHANGES_REQUESTED")] | length'
            )"; then
              set_status pending "CodeRabbit gate query failed"
              exit 0
            fi
            if [ "$prior_cr" != "0" ]; then
              set_status pending "CodeRabbit re-review pending after requested changes"
              exit 0
            fi
            # 统一最终守卫：重查当前 head 终态 + 最新 run，被取代则退出不写。
            guard_before_success
            set_status success "CodeRabbit review skipped; required checks gate merge"
            exit 0
          fi

          # 落定后再次按 HEAD 决策判断：COMMENTED 中间态/无终态评审 → pending。
          if ! head_json="$(head_decision)"; then
            set_status pending "CodeRabbit gate query failed"
            exit 0
          fi
          head_state="$(printf '%s' "$head_json" | jq -r .state)"
          case "$head_state" in
            APPROVED) guard_before_success; set_status success "CodeRabbit approved" ;;
            CHANGES_REQUESTED) set_status failure "CodeRabbit requested changes" ;;
            DISMISSED) set_status pending "CodeRabbit review dismissed" ;;
            *) set_status pending "CodeRabbit review completed without terminal decision" ;;
          esac
