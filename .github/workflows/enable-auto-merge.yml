name: Enable auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]

# 全局串行 reconcile，避免并行 enable/disable 竞态。
concurrency:
  group: pr-automerge-queue
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile-queue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: scripts/ci/pr-automerge-queue.sh
          sparse-checkout-cone-mode: false
      - name: Reconcile FIFO auto-merge queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/pr-automerge-queue.sh
