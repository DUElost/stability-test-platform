name: Enable auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# 同一 PR 的并发运行只保留最新一个，避免重复写操作。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 不给整个 workflow 写权限；enable-auto-merge job 单独声明最小写权限。
permissions:
  {}

jobs:
  enable-auto-merge:
    # 仅同仓库、非 draft PR：fork PR 的 GITHUB_TOKEN 只读，且不应获得自动合入能力。
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    # gh pr merge --auto --merge 需要 PR 与 base 分支的写权限，job 内按需授予。
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          method="$(
            gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){autoMergeRequest{mergeMethod}}}}' \
              -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.autoMergeRequest.mergeMethod // ""'
          )"
          if [ "$method" != "MERGE" ]; then
            gh pr merge "$PR_URL" --auto --merge
          fi

  fallback-approval:
    # CodeRabbit 被 rate limit 挡住时排除 CodeRabbit：由 github-actions[bot]
    # 提交 APPROVE，合入仍由 required checks + auto-merge 把关。
    # CodeRabbit 明确 CHANGES_REQUESTED 时绝不绕过。
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Fallback approval on CodeRabbit rate limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest_state="$(
            gh api "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER/reviews" \
              --jq '[.[] | select(.user.login == "coderabbitai")][-1].state // ""'
          )"
          if [ "$latest_state" = "APPROVED" ]; then
            echo "CodeRabbit already approved; nothing to do"
            exit 0
          fi
          if [ "$latest_state" = "CHANGES_REQUESTED" ]; then
            echo "CodeRabbit explicitly requested changes; fallback skipped"
            exit 0
          fi

          # 等 CodeRabbit 在该 commit 上的状态落定（最多 15 分钟）：
          # in progress → 继续等；rate limited / completed / 其他 → 停止轮询。
          desc=""
          for _ in $(seq 1 90); do
            desc="$(
              gh api "repos/$REPO_OWNER/$REPO_NAME/commits/$HEAD_SHA/status" \
                --jq '[.statuses[] | select(.context == "CodeRabbit")][0].description // ""'
            )"
            if [ -n "$desc" ] && ! printf '%s' "$desc" | grep -qi 'in.progress'; then
              break
            fi
            sleep 10
          done
          if [ -z "$desc" ] || printf '%s' "$desc" | grep -qi 'in.progress'; then
            echo "CodeRabbit status never settled; fail closed"
            exit 0
          fi
          if ! printf '%s' "$desc" | grep -qi 'rate.limit'; then
            echo "CodeRabbit not rate-limited: $desc; fallback skipped"
            exit 0
          fi

          echo "CodeRabbit rate limited: $desc; submitting fallback approval"
          gh api -X POST "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE \
            -f body="CodeRabbit 当前被 rate limit 挡住（$desc），按仓库策略降级为自动批准；合入仍由 required checks + auto-merge 把关。"
