name: Enable auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]

# 同一 PR 的并发运行只保留最新一个，避免重复写操作。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 不给整个 workflow 写权限；各 job 单独声明最小权限。
permissions:
  {}

jobs:
  enable-auto-merge:
    # 仅同仓库、非 draft PR：fork PR 的 GITHUB_TOKEN 只读，且不应获得自动合入能力。
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    # gh pr merge --auto --merge 需要 PR 与 base 分支的写权限，job 内按需授予。
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          method="$(
            gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){autoMergeRequest{mergeMethod}}}}' \
              -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.autoMergeRequest.mergeMethod // ""'
          )"
          if [ "$method" != "MERGE" ]; then
            gh pr merge "$PR_URL" --auto --merge
          fi

  merge-gate:
    # 准入门禁：CodeRabbit APPROVED → success；CHANGES_REQUESTED → failure；
    # rate limited → success（按仓库策略排除 CodeRabbit，由 required checks 把关）；
    # 其他状态 → pending/failure，fail-closed。
    # job 名刻意不用 code-rabbit-gate，避免 job check run 与 required commit
    # status 同名，造成 required check 来源歧义。
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Set code-rabbit-gate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          set_status() {
            local state="$1" desc="$2"
            gh api -X POST "repos/$REPO_OWNER/$REPO_NAME/statuses/$HEAD_SHA" \
              -f state="$state" -f context=code-rabbit-gate -f description="$desc" >/dev/null
          }
          latest_review() {
            local out
            out="$(
              gh api --paginate --slurp "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER/reviews" \
                | jq -c --arg head_sha "$HEAD_SHA" \
                    '[.[][] | select(.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") | select(.commit_id == $head_sha)] | sort_by(.id) | .[-1] | {id: (.id // 0), state: (.state // "")}'
            )" || {
              set_status pending "CodeRabbit gate query failed"
              exit 0
            }
            printf '%s' "$out"
          }
          review_by_id() {
            # 评审事件专用：精确匹配 REVIEW_ID 且 commit_id 等于当前 HEAD 的评审。
            local out
            out="$(
              gh api --paginate --slurp "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER/reviews" \
                | jq -c --arg head_sha "$HEAD_SHA" --arg id "$REVIEW_ID" \
                    '[.[][] | select(.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") | select(.commit_id == $head_sha and ((.id // 0) | tostring) == $id)] | .[0] | {id: (.id // 0), state: (.state // "")}'
            )" || {
              set_status pending "CodeRabbit gate query failed"
              exit 0
            }
            printf '%s' "$out"
          }

          # 评审提交事件：仅处理 CodeRabbit 的评审；人工评审事件直接跳过。
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            if [ "$REVIEW_AUTHOR" != "coderabbitai[bot]" ] && [ "$REVIEW_AUTHOR" != "coderabbitai" ]; then
              echo "Review by ${REVIEW_AUTHOR:-unknown}; merge-gate skipped"
              exit 0
            fi
            # REST 可能稍后才能看到刚提交的评审；仅当 id 与 REVIEW_ID 对齐才结束
            # 重试（最多 60 秒），避免旧评审状态提前结束循环导致误写 success。
            state=""
            id=""
            for _ in $(seq 1 12); do
              review_json="$(review_by_id)"
              id="$(printf '%s' "$review_json" | jq -r .id)"
              state="$(printf '%s' "$review_json" | jq -r .state)"
              [ "$id" = "$REVIEW_ID" ] && break
              sleep 5
            done
            if [ "$id" != "$REVIEW_ID" ]; then
              set_status pending "CodeRabbit review pending"
              exit 0
            fi
            case "$state" in
              APPROVED) set_status success "CodeRabbit approved" ;;
              CHANGES_REQUESTED) set_status failure "CodeRabbit requested changes" ;;
              *) set_status pending "CodeRabbit review pending" ;;
            esac
            exit 0
          fi

          state="$(latest_review | jq -r .state)"
          if [ "$state" = "CHANGES_REQUESTED" ]; then
            set_status failure "CodeRabbit requested changes"
            exit 0
          fi
          if [ "$state" = "APPROVED" ]; then
            set_status success "CodeRabbit approved"
            exit 0
          fi

          # 等 CodeRabbit 在该 commit 上的状态落定（最多 10 分钟）：
          # in progress → 继续等；rate limited / completed / 其他 → 停止轮询。
          desc=""
          for _ in $(seq 1 60); do
            desc="$(
              gh api "repos/$REPO_OWNER/$REPO_NAME/commits/$HEAD_SHA/status" \
                --jq '[.statuses[] | select(.context == "CodeRabbit")][0].description // ""'
            )"
            if [ -n "$desc" ] && ! printf '%s' "$desc" | grep -qi 'in.progress'; then
              break
            fi
            sleep 10
          done
          if [ -z "$desc" ] || printf '%s' "$desc" | grep -qi 'in.progress'; then
            set_status pending "Waiting for CodeRabbit review or rate-limit decision"
            exit 0
          fi
          if printf '%s' "$desc" | grep -qi 'rate.limit'; then
            set_status success "CodeRabbit rate limited; required checks gate merge"
            exit 0
          fi

          state="$(latest_review | jq -r .state)"
          case "$state" in
            APPROVED) set_status success "CodeRabbit approved" ;;
            CHANGES_REQUESTED) set_status failure "CodeRabbit requested changes" ;;
            *) set_status failure "CodeRabbit review unexpected state: $state" ;;
          esac
