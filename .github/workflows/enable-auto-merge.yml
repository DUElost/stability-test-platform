name: Enable auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          number="${{ github.event.pull_request.number }}"
          enabled="$(
            gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){autoMergeRequest{enabledAt}}}}' \
              -F owner="$owner" -F repo="$repo" -F number="$number" \
              --jq '.data.repository.pullRequest.autoMergeRequest != null'
          )"
          if [ "$enabled" != "true" ]; then
            gh pr merge "${{ github.event.pull_request.html_url }}" --auto --merge
          fi
