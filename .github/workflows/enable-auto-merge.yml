name: Enable auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  # 队首合入后要给下一 PR 挂 auto-merge，但那一刻没有可用事件，只能靠 cron：
  # - pull_request closed：auto-merge 合入被级联限制抑制；
  # - workflow_run：main 上唯一的 workflow 是 CodeQL 默认 setup，其 run 不参与
  #   workflow_run 链（#587 于 11:23:59Z 合入后无新 pr-update-branch run）；
  # - on: push：同样无效——#589 于 11:43:18Z 合入后没有产生任何 push 事件 run，
  #   auto-merge 的 merge commit 不触发自定义 workflow 的 push。
  # 频率取每小时而非 */10：高频 cron 被 GitHub 节流到 2–6 小时一次（2026-08-30
  # 统计：25.6h 内仅 4 次 schedule run），而 main-ci-backstop.yml 的每日 cron
  # 连续多日每次都触发——低频调度实测可靠。取 23 分而非整点，避开调度高峰。
  schedule:
    - cron: "23 * * * *"

# 全局串行 reconcile，避免并行 enable/disable 竞态。
concurrency:
  group: pr-automerge-queue
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile-queue:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # pull_request：默认 merge commit（含本 PR 脚本；首合入 bootstrap 勿 pin main）。
          # schedule：脚本以 main 为准。
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          sparse-checkout: scripts/ci/pr-automerge-queue.sh
          sparse-checkout-cone-mode: false
      - name: Reconcile queue and update head if behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/pr-automerge-queue.sh
