name: Main CI backstop

# auto-merge 的 merge commit 由 GitHub 内部凭据推送，on: push、pull_request.closed
# 与 workflow_run 的触发都会被 GITHUB_TOKEN 级联限制抑制（实测均不触发）。
# 定时兜底：每天一次（UTC 18:00 = 本地凌晨 02:00）检查 main 尖端是否已有全量 CI
# （workflow_dispatch / push），没有就显式 dispatch ci.yml。workflow_dispatch 是
# 显式触发，不受级联限制。PR 阶段保持轻量检查，main 全量统一每天验证一次。
#
# 全量 CI 结束后追加 auto-merge 遗留兜底（仅 conclusion == success 时执行；
# CI 失败/取消/超时则跳过，分支保留到下次 PASS）：
# - 远端分支清理：仓库已开启 "Automatically delete head branches"，但
#   auto-merge 合入的 PR 不会触发该自动删除（GitHub 已知行为）；
# - 关联 issue 补关：auto-merge 由 github-actions[bot]（GITHUB_TOKEN）合入时，
#   GitHub 原生「合并关联 PR 自动关闭 issue」不生效（实测 #221–#226、
#   #324–#336 全部遗留 OPEN），需要每日兜底关闭仍 OPEN 的 closing reference。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

# schedule 与 workflow_dispatch 共享同一并发组：避免同时执行重复检查；
# cancel-in-progress: false 保留正在运行的任务，不做取消。
concurrency:
  group: main-ci-backstop
  cancel-in-progress: false

# 不给整个 workflow 写权限；各 job 单独声明最小权限。
permissions:
  {}

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      ci_conclusion: ${{ steps.wait.outputs.conclusion }}
      ci_run_id: ${{ steps.ensure.outputs.run_id }}
      main_sha: ${{ steps.ensure.outputs.main_sha }}
    # actions: write —— gh workflow run / 读取运行状态；
    # contents: write —— 删除远端分支 ref；
    # pull-requests: read —— 列出已合并 PR 的 head 分支。
    # issues: write —— 补关已合入 PR 的仍开放关联 issue。
    permissions:
      actions: write
      contents: write
      pull-requests: read
      issues: write
    steps:
      - name: Ensure full CI run for main tip
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

          # 复用「进行中或已成功」的运行；已失败/取消的不复用（#384）——
          # 否则每晚都盯着同一个失败 run 追加评论、永不重派新 CI，
          # failure issue 无法自愈。ci.yml 无 push 触发、auto-merge commit
          # 不触发 workflow_run，重试只能由这里显式 dispatch。
          run_id="$(
            gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$main_sha&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" or .event == "push") | select(.status != "completed" or .conclusion == "success")][0].id // 0'
          )"
          if [ "$run_id" = "0" ]; then
            echo "No full CI run for main tip $main_sha; dispatching"
            gh workflow run ci.yml --ref main -R "$REPO"
            # dispatch 创建有延迟，轮询等待运行出现（最多 10 分钟）
            for _ in $(seq 1 60); do
              run_id="$(
                gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$main_sha&event=workflow_dispatch&per_page=5" \
                  --jq '[.workflow_runs[]][0].id // 0'
              )"
              [ "$run_id" != "0" ] && break
              sleep 10
            done
          fi
          if [ "$run_id" = "0" ]; then
            echo "Dispatched full CI run did not appear within 10 minutes" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using full CI run $run_id for main tip $main_sha"

      - name: Wait for full CI to complete
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.ensure.outputs.run_id }}
        run: |
          set -euo pipefail
          status=""
          conclusion=""
          # 最多等 3 小时（180 次 × 60s）；全量 CI 含 backend/frontend/docker
          for _ in $(seq 1 180); do
            run_json="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
            status="$(printf '%s' "$run_json" | jq -r '.status')"
            conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"
            [ "$status" = "completed" ] && break
            sleep 60
          done
          if [ "$status" != "completed" ]; then
            # #384: 超时也要输出结论占位 —— notify-failure 门禁要求非空且非
            # success/unknown/cancelled，空串会在 infra 错误时误开 failure issue。
            echo "conclusion=unknown" >> "$GITHUB_OUTPUT"
            echo "Full CI run $RUN_ID did not complete within 3 hours" >&2
            exit 1
          fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Full CI run $RUN_ID conclusion: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "Main full CI did not pass; merged-branch cleanup skipped"
            exit 1
          fi

      - name: Delete merged head branches after PASS
        if: steps.wait.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # ensure 步骤确认过的 main SHA；清理前会重读当前 main，
          # 若已前进则放弃本次清理（避免基于旧快照删除分支）。
          MAIN_SHA: ${{ steps.ensure.outputs.main_sha }}
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$current_main_sha" != "$MAIN_SHA" ]; then
            echo "main advanced ($MAIN_SHA -> $current_main_sha); merged-branch cleanup skipped"
            exit 0
          fi

          default_branch="$(gh api "repos/$REPO" --jq .default_branch)"
          protected_branches="$(
            gh api --paginate "repos/$REPO/branches?protected=true&per_page=100" \
              | jq -s -r '.[][].name' | sort -u
          )"
          open_heads="$(
            gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              | jq -s -r --arg repo "$REPO" '.[][] | select(.head.repo.full_name == $repo) | .head.ref' | sort -u
          )"
          remote_refs="$(
            gh api --paginate "repos/$REPO/git/refs/heads?per_page=100" \
              | jq -s -r '.[][].ref' | sort -u
          )"
          merged_heads="$(
            gh api --paginate "repos/$REPO/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" \
              | jq -s -r --arg repo "$REPO" '.[][] | select(.merged_at != null) | select(.head.repo.full_name == $repo) | .head.ref' | sort -u
          )"

          deleted=0
          skipped=0
          for branch in $merged_heads; do
            [ -n "$branch" ] || continue
            if [ "$branch" = "$default_branch" ]; then
              echo "skip default branch: $branch"
              skipped=$((skipped + 1)); continue
            fi
            if printf '%s\n' "$protected_branches" | grep -Fxq -- "$branch"; then
              echo "skip protected branch: $branch"
              skipped=$((skipped + 1)); continue
            fi
            if printf '%s\n' "$open_heads" | grep -Fxq -- "$branch"; then
              echo "skip branch with open PR: $branch"
              skipped=$((skipped + 1)); continue
            fi
            if ! printf '%s' "$branch" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "skip branch with unsafe characters: $branch"
              skipped=$((skipped + 1)); continue
            fi
            if ! printf '%s\n' "$remote_refs" | grep -Fxq -- "refs/heads/$branch"; then
              echo "remote ref already gone, skip: $branch"
              skipped=$((skipped + 1)); continue
            fi
            # 快照只是快速路径；删除前按当前分支重查 open PR，
            # 避免清理期间该分支刚被新 PR 复用导致误删。
            open_count="$(
              gh api graphql \
                -f query='query($owner:String!,$repo:String!,$branch:String!){repository(owner:$owner,name:$repo){pullRequests(states:OPEN,headRefName:$branch,first:1){totalCount}}}' \
                -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F branch="$branch" \
                --jq '.data.repository.pullRequests.totalCount' 2>/dev/null || echo ''
            )"
            if [ -z "$open_count" ]; then
              echo "skip branch with open-PR recheck failed: $branch"
              skipped=$((skipped + 1)); continue
            fi
            if [ "$open_count" != "0" ]; then
              echo "skip branch with open PR (re-checked): $branch"
              skipped=$((skipped + 1)); continue
            fi
            if ! gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "delete failed, skip: $branch"
              skipped=$((skipped + 1)); continue
            fi
            echo "deleted merged branch: $branch"
            deleted=$((deleted + 1))
          done
          echo "cleanup done: deleted=$deleted skipped=$skipped"

      - name: Close linked issues after PASS
        if: steps.wait.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # ensure 步骤确认过的 main SHA；关闭前会重读当前 main，
          # 若已前进则放弃本次关闭（避免基于旧快照处理）。
          MAIN_SHA: ${{ steps.ensure.outputs.main_sha }}
        run: |
          set -euo pipefail

          current_main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$current_main_sha" != "$MAIN_SHA" ]; then
            echo "main advanced ($MAIN_SHA -> $current_main_sha); linked-issue close skipped"
            exit 0
          fi

          # 近 30 天合入的 PR 中，找 GitHub 已建立 closing reference 且关联
          # issue 仍 OPEN 的项。用 closingIssuesReferences 而非正则解析 PR
          # body：这正是 GitHub 原生自动关闭所依赖的连接，最权威。
          since="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          cursor=""
          : > "$tmp"
          while :; do
            page_json="$(
              gh api graphql \
                -f query='query($owner:String!,$repo:String!,$cursor:String){repository(owner:$owner,name:$repo){pullRequests(first:100,after:$cursor,orderBy:{field:UPDATED_AT,direction:DESC},states:MERGED){pageInfo{hasNextPage endCursor} nodes{number mergedAt closingIssuesReferences(first:10){nodes{number state}}}}}}' \
                -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F cursor="$cursor"
            )"
            jq -r --arg since "$since" \
              '.data.repository.pullRequests.nodes[] as $pr | select($pr.mergedAt >= $since) | $pr.closingIssuesReferences.nodes[]? | select(.state == "OPEN") | "\(.number)\t\($pr.number)"' \
              <<<"$page_json" >> "$tmp"
            has_next="$(jq -r '.data.repository.pullRequests.pageInfo.hasNextPage' <<<"$page_json")"
            cursor="$(jq -r '.data.repository.pullRequests.pageInfo.endCursor // ""' <<<"$page_json")"
            [ "$has_next" = "true" ] || break
          done

          closed=0
          skipped=0
          while IFS=$'\t' read -r issue pr; do
            [ -n "$issue" ] || continue
            # 查询到执行之间可能已被人关闭，逐条复查避免重复关闭报错。
            state="$(gh issue view "$issue" --repo "$REPO" --json state --jq .state)"
            if [ "$state" != "OPEN" ]; then
              echo "already closed, skip: issue #$issue (PR #$pr)"
              skipped=$((skipped + 1)); continue
            fi
            if ! gh issue close "$issue" --repo "$REPO" \
                 --comment "PR #$pr 已合入 main；auto-merge（github-actions[bot]）未触发 GitHub 原生 linked-issue 自动关闭，由 main-ci-backstop 每日兜底补关。"; then
              echo "close failed, skip: issue #$issue (PR #$pr)"
              skipped=$((skipped + 1)); continue
            fi
            echo "closed linked issue #$issue (PR #$pr)"
            closed=$((closed + 1))
          done < "$tmp"
          echo "linked-issue close done: closed=$closed skipped=$skipped"

  notify-failure:
    # 夜间全量 CI 失败时开 issue（同 label 的 open issue 复用、只追加评论，
    # 避免每晚刷屏）。零外部依赖：GITHUB_TOKEN 直接开 issue，失败进入 GitHub
    # 通知流。恢复后由 notify-recovery 自动关闭。
    # #384: 只在「观察到真实失败结论」时通知 —— 空串（ensure/wait 步骤失败，
    # 未观察到任何结论）与 unknown（等待超时）属基础设施问题，走本 workflow
    # 自身的失败通知，不混进 CI 失败 issue；cancelled 是人工取消，且失败 run
    # 次日会被重新 dispatch（ensure 步骤不复用非 success 的完成态 run），同样不开。
    if: >-
      always() && !cancelled() &&
      needs.verify-and-cleanup.outputs.ci_conclusion != '' &&
      needs.verify-and-cleanup.outputs.ci_conclusion != 'success' &&
      needs.verify-and-cleanup.outputs.ci_conclusion != 'unknown' &&
      needs.verify-and-cleanup.outputs.ci_conclusion != 'cancelled'
    needs: [verify-and-cleanup]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or comment failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RUN_ID: ${{ needs.verify-and-cleanup.outputs.ci_run_id }}
          MAIN_SHA: ${{ needs.verify-and-cleanup.outputs.main_sha }}
        run: |
          set -euo pipefail
          gh label create "ci/backstop-failed" --repo "$REPO" --color d73a4a \
            --description "Main CI backstop failed (auto issue)" || true
          # #384: REST issues 端点混返 PR（带同 label 的 PR 会被误评论/误关），
          # select(.pull_request == null) 只留真 issue；#389: --jq 取首个，
          # 避免 pipefail 下 head -n 1 提前关管道触发 jq SIGPIPE。
          existing="$(
            gh api --paginate \
              "repos/$REPO/issues?labels=ci%2Fbackstop-failed&state=open" \
              --jq '[.[] | select(.pull_request == null)][0].number // ""'
          )"
          # ── 机械摘要三要素（纯 GH API；有意不做 LLM 分诊，见
          # docs/design/2026-08-governance-surface-protection.md §backstop）：
          # ① 红灯 job + 失败步骤名；② CI run 日志链接；③ 疑似变更区间 compare。
          # 失败 job 上限 20 条在 jq 内截断（.[:20]），勿改回 head 管道：
          # pipefail 下 head 提前关管道会触发 gh/jq SIGPIPE（同 #389 existing 的处理）。
          ci_run_url="${{ github.server_url }}/$REPO/actions/runs/$CI_RUN_ID"
          failed_jobs="$(gh api "repos/$REPO/actions/runs/$CI_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[]
                   | select(.conclusion == "failure")
                   | "- **\(.name)** → 失败步骤: "
                     + ([.steps[]? | select(.conclusion == "failure") | .name] | join(", "))] | .[:20] | join("\n")'
          )"
          [ -n "$failed_jobs" ] || failed_jobs="(未取到 job 明细——疑似基础设施错误或运行已被清理)"
          suspect_line="无（无法定位区间）"
          parent_sha="$(gh api "repos/$REPO/commits/$MAIN_SHA" --jq '.parents[0].sha' 2>/dev/null || true)"
          if [ -n "${parent_sha:-}" ]; then
            suspect_line="${{ github.server_url }}/$REPO/compare/${parent_sha:0:10}...${MAIN_SHA:0:10}"
          fi
          body="主 CI 兜底检查失败：${ci_run_url}（兜底工作流: ${RUN_URL}）
          main 全量 CI（backend-test / frontend-check / docker-build）未通过，
          合并分支清理已跳过。修复后下一次全量通过会由本工作流自动关闭此 issue。
          ### 红灯 job
          ${failed_jobs}
          ### 排查入口
          - 疑似变更区间: ${suspect_line}
          - 完整日志: ${ci_run_url}"
          if [ -z "$existing" ]; then
            gh issue create --repo "$REPO" \
              --title "Main CI backstop failed" \
              --label "ci/backstop-failed" --body "$body"
          else
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          fi

  notify-recovery:
    # 全量 CI 恢复通过后自动关闭 failure issue（已与仓库所有者确认该行为）。
    if: always() && !cancelled() && needs.verify-and-cleanup.outputs.ci_conclusion == 'success'
    needs: [verify-and-cleanup]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close failure issue on recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # #384: 同上 —— 过滤掉 PR，防止 gh issue close PATCH /issues/{n} 误关 PR。
          numbers="$(
            gh api --paginate \
              "repos/$REPO/issues?labels=ci%2Fbackstop-failed&state=open" \
              --jq '.[] | select(.pull_request == null) | .number'
          )"
          failures=0
          for n in $numbers; do
            if ! gh issue close "$n" --repo "$REPO" \
                 --comment "主 CI 已恢复通过（${RUN_URL}），自动关闭。"; then
              echo "close failed: $n"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "failed to close $failures issue(s)" >&2
            exit 1
          fi
