name: Regenerate dev lock

# 背景（2026-08-30 事故）：
#   Dependabot 提 #577 把 pytest-cov 约束从 >=6.0 改成 >=7.1.0，只改了
#   backend/requirements-dev.txt、**没重新生成 lock**。PR 本身全绿合入
#   （PR 阶段不跑 tests/），于是 main 当天的全量 CI 红在
#   test_lock_digest_matches_requirements —— 守卫生效了，但红灯出现在
#   合入之后、由夜间 job 兜底发现，排查时上下文已经切走。
#
# 本 workflow 把「重新生成 lock」这一步接进 Dependabot PR 本身：
# 锁变更随 PR 一起进 CI 验证，不再等到 main 变红。
#
# 为什么只覆盖 dev lock、不覆盖 requirements.lock（运行时那份）：
#   见下方 warn-runtime-lock job 的注释。简言之 —— 运行时 lock 用 pip-compile
#   （实测 30 分钟仍未完成，CI 里不可能用），改用 uv 又会改变生产镜像的依赖
#   hash（18 个包版本不同，含 cryptography 49→50、websockets 16→17 两个
#   major），那是需要单独验证的变更，不该塞进自动化 PR。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - backend/requirements-dev.txt
      - backend/requirements.txt
      - backend/requirements-dev.lock

# 同一 PR 连续 push 时只保留最新一轮，避免多次重生成互相覆盖。
concurrency:
  group: dev-lock-regen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  regenerate-dev-lock:
    # 只处理 Dependabot 的 PR：这是观测到的实际失效场景，且 blast radius
    # 最小 —— 不往人类开的 PR 分支上偷偷 push commit（那个更该本地做，
    # AGENTS.md 已写明「改了 requirements* 必须重新生成 lock」）。
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 检出 PR 分支本身（不是 merge ref）—— 要往这个分支推 commit。
          ref: ${{ github.head_ref }}
          # 本 job 依赖推送权限，故**不能**像其他 job 那样置 false。
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # 从**仓库根**运行，与 backend/requirements-dev.lock 抬头的命令一致 ——
      # 在 backend/ 里跑会让 `# via` 来源标记少掉 `backend/` 前缀，虽然
      # tests/test_requirements_dev_lock.py 已按文件名子串匹配、两种都认，
      # 但与文档命令保持一致能避免下次再生歧义。
      - name: Regenerate and stamp
        env:
          LOCK: backend/requirements-dev.lock
        run: |
          set -euo pipefail

          # ① 先保存原文档头部。uv 会覆盖整个文件头部 —— 2026-08-30 那次
          #    重生成就把 26 行说明（生成命令、为什么用 uv、--stamp 要求）
          #    连根冲掉了。不保存的话，头部一旦恢复也撑不到下一次 Dependabot。
          #    取「第一个包行之前」的注释行，并剔除 uv 自带的 autogen 块
          #    （新文件会带自己的，留着会重复）。
          python - "$LOCK" <<'PY'
          import pathlib, sys

          p = pathlib.Path(sys.argv[1])
          head = []
          for line in p.read_text(encoding="utf-8").splitlines():
              if line.strip() and not line.startswith("#"):
                  break
              head.append(line)

          # uv 的 autogen 块永远是头部的最后一段，所以按标记行**切断丢弃**，
          # 而不是按行前缀过滤 —— 后者扛不住意外产生的 `## This file...`
          # （拼接漏换行就会这样），漏网的话重生成后会出现两份 uv 头部。
          cut = next(
              (i for i, l in enumerate(head) if "This file was autogenerated" in l),
              len(head),
          )
          keep = head[:cut]
          # 去掉尾部空注释行，避免每次往返都多堆一行
          while keep and keep[-1].strip() in ("", "#"):
              keep.pop()

          pathlib.Path("/tmp/lock-header.txt").write_text(
              "\n".join(keep) + "\n" if keep else "", encoding="utf-8"
          )
          print(f"保存文档头部 {len(keep)} 行（原头部 {len(head)} 行，丢弃 uv autogen {len(head) - len(keep)} 行）")
          PY

          # ② 从**仓库根**运行，与 backend/requirements-dev.lock 抬头的命令一致：
          #    在 backend/ 里跑会让 `# via` 来源标记少掉 `backend/` 前缀。虽然
          #    tests/test_requirements_dev_lock.py 已按文件名子串匹配、两种都认，
          #    但与文档命令保持一致能避免下次再生歧义。
          uv pip compile --python-version 3.11 --generate-hashes --strip-extras \
            --output-file "$LOCK" backend/requirements-dev.txt

          # ③ 装回文档头部（放在 uv autogen 块之上）
          python - "$LOCK" <<'PY'
          import pathlib, sys

          p = pathlib.Path(sys.argv[1])
          header = pathlib.Path("/tmp/lock-header.txt").read_text(encoding="utf-8")
          p.write_text(header + p.read_text(encoding="utf-8"), encoding="utf-8")
          PY

          # ④ 打摘要。必须在头部（注释区）内 —— read_recorded() 遇到第一个
          #    包行就停，装回头部之后打戳才能保证位置正确。
          python tools/dev/requirements_digest.py \
            backend/requirements-dev.txt "$LOCK" --stamp

      # 幂等：lock 没变化就不提交。推送 commit 会再次触发本 workflow
      # （paths 含 lock 文件），靠这里的 diff 检查终止循环。
      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/requirements-dev.lock; then
            echo "::notice::dev lock 已是最新，无需提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements-dev.lock
          git commit -m "chore(deps): 重新生成 requirements-dev.lock（Dependabot 只改了 manifest）

          自动提交：本 PR 改了 backend/requirements*.txt 但未同步 lock，
          由 regenerate-dev-lock.yml 重新生成并 --stamp。
          生成方式见该文件抬头（uv，按 py3.11 解析）。"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "::notice::已提交并推送 dev lock 更新"

  # ── 运行时 lock：不自动重生成，但要立刻让人看见 ──────────────────────
  #
  # 为什么不能一视同仁地自动化：
  #   1. requirements.lock 由 pip-compile 生成。实测同一份输入 30 分钟仍未
  #      完成（第二次复测 5m39s 仍在跑，CPU 近乎空转，卡在顺序请求每个
  #      候选版本的元数据上）—— CI 里根本用不了。
  #   2. 改用 uv 能秒出，但解析结果与现有 lock 差 18 个包，含
  #      cryptography 49→50、websockets 16→17 两个 major。这份 lock 是
  #      生产镜像的输入（Dockerfile.backend --require-hashes），换工具等于
  #      改生产依赖，必须单独验证（至少要拿新版本跑通 backend/tests）。
  #      历史上有先例：#247 里 Dependabot 只改 manifest，是 DUElost 手动
  #      push 了「regenerate requirements.lock under py3.11」才补上的。
  #
  # 所以这里只做一件事：把这个「需要人工动作」的事实摆到 PR 上，
  # 而不是等 main 变红后由 nightly job 发现。
  warn-runtime-lock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check whether runtime manifest changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed="$(gh pr view "$PR" --json files -q '.files[].path')"
          if printf '%s\n' "$changed" | grep -qx 'backend/requirements.txt'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::backend/requirements.txt 被修改，requirements.lock 需人工重新生成"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "本次未改运行时 manifest，跳过"
          fi

      - name: Comment with the exact command
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cat <<'BODY' > /tmp/comment.md
          ## ⚠️ `requirements.lock` 需要人工重新生成

          本 PR 改了 `backend/requirements.txt`，但 `backend/requirements.lock`
          （**生产镜像**的输入）无法自动重生成：它走 pip-compile，而该工具在这份
          输入上实测 30 分钟未完成，CI 里不可用；改用 uv 会改变生产依赖 hash
          （与现有 lock 差 18 个包，含 `cryptography` 49→50、`websockets` 16→17
          两个 major），需要单独验证。

          `requirements-dev.lock`（CI 用）已由本 PR 的 workflow 自动重生成。

          生成命令（须在 py3.11 下）：

          ```bash
          docker run --rm -v "$PWD/backend:/w" -w /w python:3.11-slim \
            sh -c "pip install -q pip-tools && pip-compile --generate-hashes \
                   --strip-extras --output-file=requirements.lock requirements.txt"
          python tools/dev/requirements_digest.py \
            backend/requirements.txt backend/requirements.lock --stamp
          ```

          不补的话 `tests/test_requirements_lock.py` 会在 **main 的全量 CI** 里红
          —— PR 阶段不跑 `tests/`，所以合并前看不出来。
          BODY
          gh pr comment "$PR" --body-file /tmp/comment.md
          # 让 job 失败：这是个「需要人工动作」的状态，不能在检查列表里显示绿色。
          # 注意本 job 目前**不在** required checks 里，所以不会阻塞 auto-merge；
          # 它只是把红灯摆到 PR 页面上。要真正阻塞需另开 PR 加进分支保护。
          exit 1
