name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stability_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      JWT_SECRET_KEY: "ci-test-secret-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # dev 清单包含运行时依赖 + pytest / testcontainers
        run: pip install -r backend/requirements-dev.txt
      - name: Compile check
        run: python -m compileall backend/ -q
      - name: Migrate empty PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests
        run: python -m pytest backend/tests/ -v
      - name: Main-chain integration smoke
        run: >-
          python -m pytest
          backend/tests/integration/test_main_chain_happy_path.py
          backend/tests/integration/test_pending_timeout_socketio.py
          backend/tests/integration/test_plan_chain_e2e.py
          backend/tests/test_seed_and_smoke.py
          -v
      - name: Run agent tests
        run: python -m pytest backend/agent/tests/ -v
      # 根 tests/ 也在 pytest.ini 的 testpaths 里(迁移升级 + 部署脚本契约),
      # 此前从未在 CI 跑过。test_repo_layout.py 现在会守住这条对应关系。
      - name: Run repo-level tests
        run: python -m pytest tests/ -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Run vitest
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npm run build

  # Lint —— ruff / ESLint 均已阻塞。
  #
  # ruff 已于 2026-08-04 清零(#155/#157);ESLint 于 2026-08-05 清零
  # (#159/#161/#162),本步骤已启用 --max-warnings 0 并摘 continue-on-error。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 脚本版本不可变门禁要跟 base ref 做三点 diff,浅克隆拿不到 merge-base
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint -- --max-warnings 0

      - name: Install ruff
        # 版本随 requirements-dev.txt 走,避免 CI 与本地报出不同结果
        run: pip install "$(grep -E '^ruff' backend/requirements-dev.txt)"
      - name: Ruff
        run: ruff check backend/ tools/ scripts/

      # 这条**阻塞**:不是风格建议,是二值门禁,且当前全仓已清零。
      # pre-commit 钩子需开发者手动 `git config core.hooksPath .githooks`
      # 才生效 —— pipeline_engine.py 当年就是这么漏进来的,CI 侧兜底。
      # 前端也要扫:历史上撞坏 diff 的 PlanEditPage.tsx 就是 .tsx
      # (见 .gitattributes 与 README「EOL 与污染防御」)。非 .py 只检测不改写。
      - name: 空行注入污染检查
        run: |
          find backend tools scripts frontend/src -type f \
            \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' \
               -o -name '*.js' -o -name '*.jsx' \) \
            -not -path '*/resources/*' -not -path '*/__pycache__/*' \
            -not -path '*/node_modules/*' \
            | xargs python tools/dev/collapse-blank-pollution.py --check -q

      # 这条也**阻塞**:ADR-0020 规定已发布的脚本版本目录内容不可变。
      # 2026-07-31 生产事故就是 ef8808e 的 `ruff --fix` 原地改写了这些目录,
      # 导致 18/27 行 script 的 DB sha 与磁盘永久对不上、全平台派发中断。
      # ruff.toml 已把该目录加进 extend-exclude,这条是兜底(手改同样拦)。
      - name: 脚本版本不可变检查(ADR-0020)
        run: |
          python tools/dev/check-script-version-immutability.py \
            --base "origin/${{ github.base_ref || github.ref_name }}"

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t stability-backend .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t stability-frontend .
