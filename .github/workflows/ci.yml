name: CI

on:
  pull_request:
    branches: [main]
  # main 全量 CI 仅由 main-ci-backstop 每天定时（UTC 18:00）dispatch 触发；
  # 不保留 push main 触发——auto-merge 的 push 会被级联限制抑制，手动合入的
  # push 又会造成「合入即全量」的随机运行。workflow_dispatch 仅定时任务使用。
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR/分支连续 push 时只保留最新一轮完整 CI，避免旧 commit 的
# backend-test/frontend-check/build 全部跑完浪费 Actions 并发与分钟。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    # 全量 job：仅在 push main / workflow_dispatch 时运行。
    # PR 只跑下方轻量 job（lint / pr-agent-tests / pr-backend-test /
    # pr-migrate-empty-db / pr-typecheck / pr-compileall）。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stability_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      JWT_SECRET_KEY: "ci-test-secret-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        # dev 清单包含运行时依赖 + pytest / testcontainers
        run: pip install -r backend/requirements-dev.txt
      - name: Compile check
        run: python -m compileall backend/ tools/ scripts/ -q
      - name: Migrate empty PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests
        run: python -m pytest backend/tests/ -v
      - name: Run agent tests
        run: python -m pytest backend/agent/tests/ -v
      # 根 tests/ 也在 pytest.ini 的 testpaths 里(迁移升级 + 部署脚本契约),
      # 此前从未在 CI 跑过。test_repo_layout.py 现在会守住这条对应关系。
      - name: Run repo-level tests
        run: python -m pytest tests/ -v

  frontend-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Run vitest
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npm run build

  # Lint —— ruff / ESLint 均已阻塞。
  #
  # ruff 已于 2026-08-04 清零(#155/#157);ESLint 于 2026-08-05 清零
  # (#159/#161/#162),本步骤已启用 --max-warnings 0 并摘 continue-on-error。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # 脚本版本不可变门禁要跟 base ref 做三点 diff,浅克隆拿不到 merge-base
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint -- --max-warnings 0

      - name: Install ruff
        # 版本随 requirements-dev.txt 走,避免 CI 与本地报出不同结果
        run: pip install "$(grep -E '^ruff' backend/requirements-dev.txt)"
      - name: Ruff
        run: ruff check backend/ tools/ scripts/

      # 前端死文件/死依赖（G23 收尾，issue #459 状态评论）：实测 0.9s；
      # 粒度收窄为 files+dependencies，取舍见
      # docs/notes/process/2026-08-14-dead-code-knip.md
      - name: knip 死代码检查
        working-directory: frontend
        run: npm run --silent knip

      # 这条**阻塞**:不是风格建议,是二值门禁,且当前全仓已清零。
      # pre-commit 钩子需开发者手动 `git config core.hooksPath .githooks`
      # 才生效 —— pipeline_engine.py 当年就是这么漏进来的,CI 侧兜底。
      # 前端也要扫:历史上撞坏 diff 的 PlanEditPage.tsx 就是 .tsx
      # (见 .gitattributes 与 README「EOL 与污染防御」)。非 .py 只检测不改写。
      - name: 空行注入污染检查
        run: |
          find backend tools scripts frontend/src -type f \
            \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' \
               -o -name '*.js' -o -name '*.jsx' \) \
            -not -path '*/resources/*' -not -path '*/__pycache__/*' \
            -not -path '*/node_modules/*' \
            | xargs python tools/dev/collapse-blank-pollution.py --check -q

      # 这条也**阻塞**:ADR-0020 规定已发布的脚本版本目录内容不可变。
      # 2026-07-31 生产事故就是 ef8808e 的 `ruff --fix` 原地改写了这些目录,
      # 导致 18/27 行 script 的 DB sha 与磁盘永久对不上、全平台派发中断。
      # ruff.toml 已把该目录加进 extend-exclude,这条是兜底(手改同样拦)。
      - name: 脚本版本不可变检查(ADR-0020)
        run: |
          python tools/dev/check-script-version-immutability.py \
            --base "origin/${{ github.base_ref || github.ref_name }}"

      # 治理面结构门禁（synthesis C-G1 L0）：CLAUDE.md @import 行内失效类事故的
      # 确定性拦截 + pr-agent 防绕过机制锚点守卫。检查器自身由 --self-test
      # 正反样例守护；S 规则明细见 tools/dev/check_governance_surface.py 抬头。
      - name: 治理面结构检查(C-G1 L0)
        run: |
          python tools/dev/check_governance_surface.py --check

  # ── PR 轻量检查 ──────────────────────────────────────────────────────────
  # pull_request 只跑 lint（上方，两边都跑）+ 下面五个 job（pr-agent-tests /
  # pr-backend-test / pr-migrate-empty-db / pr-typecheck / pr-compileall）；
  # 全量 backend-test/frontend-check/docker-build 仅 push main 后兜底。
  # 风险：PR 合入前不跑前端 vitest / docker build，
  # 由合入 main 后的全量兜底；若要“合并前全量”应改用 Merge Queue。
  # pr-backend-test 是 #281 后新增的信息性 job（非阻塞 required check），
  # 把控制面 backend/tests 回归提前暴露在 PR 上，见该 job 注释。
  pr-agent-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 部分 agent 测试模块 import 时会解析 DATABASE_URL，但不会真正连接；
      # 与全量 backend-test 保持一致的环境可避免收集期 RuntimeError。
      TESTING: "1"
      JWT_SECRET_KEY: "ci-test-secret-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run agent tests
        run: python -m pytest backend/agent/tests/ -q

  # #281 P2:PR 阶段补「改动影响的控制面后端测试」的信号。
  # 信息性 job(非阻塞):PG 套件耗时超过合入路径 ~2 分钟注意力预算,
  # 不作为 required check(见 docs/notes/process/2026-08-14-merge-path-
  # attention-budget.md),但把 backend/tests 回归提前暴露在 PR 上——
  # 密码长度等后端回归不再只能靠夜间全量 CI 兜底才发现。
  pr-backend-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stability_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      JWT_SECRET_KEY: "ci-test-secret-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Migrate empty PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run control-plane backend tests
        run: python -m pytest backend/tests/ -q

  # #510 教训（P0-2）：空库迁移守卫。把「空库 alembic upgrade head」从 7 分钟的
  # pr-backend-test 里拆出来做独立 required check——上线即炸的空库迁移回归在
  # PR 上必拦；成本 ~2 分钟（含依赖安装）远低于整套 backend 套件。
  pr-migrate-empty-db:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stability_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      JWT_SECRET_KEY: "ci-test-secret-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Migrate empty PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head

  pr-typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npm run type-check

  pr-compileall:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Compile check
        run: python -m compileall -q backend/ tools/ scripts/

  docker-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend-test, frontend-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t stability-backend .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t stability-frontend .
