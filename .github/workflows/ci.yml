name: CI

on:
  pull_request:
    branches: [main]
  # main 全量 CI 仅由 main-ci-backstop 每天定时（UTC 18:00）dispatch 触发；
  # 不保留 push main 触发——auto-merge 的 push 会被级联限制抑制，手动合入的
  # push 又会造成「合入即全量」的随机运行。workflow_dispatch 仅定时任务使用。
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR/分支连续 push 时只保留最新一轮完整 CI，避免旧 commit 的
# backend-test/frontend-check/build 全部跑完浪费 Actions 并发与分钟。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    # 全量 job：仅在 workflow_dispatch（main-ci-backstop 每日 UTC 18:00 dispatch）时运行。
    # PR 只跑下方轻量 job（lint / pr-agent-tests / pr-migrate-empty-db /
    # pr-typecheck / pr-compileall）。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stability_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      JWT_SECRET_KEY: "ci-test-secret-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install dependencies
        # 走 hash 锁定的 dev lock（含运行时依赖 + pytest / testcontainers / ruff /
        # pytest-cov），与本地 `pip install -r requirements-dev.txt` 装的可能是
        # 不同版本——这是有意的：CI 要可复现，本地要能追新。lock 过期时
        # tests/test_requirements_dev_lock.py 会拦住，重新生成命令见 lock 抬头。
        run: pip install --require-hashes -r backend/requirements-dev.lock
      - name: Compile check
        run: python -m compileall backend/ tools/ scripts/ -q
      - name: Migrate empty PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head
      # 覆盖率:三段 pytest 用 --cov-append 累加,最后一段统一出报告。
      # **只度量不设阈值** —— 没有 --cov-fail-under。当前水位还没摸清就设底线,
      # 等于给一个没读过的数字背书;先攒数据,水位稳定后在 .coveragerc 抬头
      # 记录的数字基础上再定(换 omit 口径会让数字不可比,届时需重测)。
      # 本地默认不带 --cov(不写进 pytest.ini 的 addopts),避免拖慢日常单测。
      - name: Run backend tests
        run: python -m pytest backend/tests/ -v --cov=backend
      - name: Run agent tests
        run: python -m pytest backend/agent/tests/ -v --cov=backend --cov-append
      # 根 tests/ 也在 pytest.ini 的 testpaths 里(迁移升级 + 部署脚本契约),
      # 此前从未在 CI 跑过。test_repo_layout.py 现在会守住这条对应关系。
      - name: Run repo-level tests
        run: python -m pytest tests/ -v --cov=backend --cov-append --cov-report=term-missing

  frontend-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
      # 同样只度量不设阈值(与后端一致):vitest 的 coverage.thresholds 未配置,
      # 覆盖率不达标不会让 job 变红。@vitest/coverage-v8 由 package.json 显式
      # 声明 —— 此前只有 test:coverage 脚本而没装 provider,直接跑会失败。
      - name: Run vitest
        working-directory: frontend
        run: npx vitest run --coverage
      - name: Build
        working-directory: frontend
        run: npm run build

  # Lint —— ruff / ESLint 均已阻塞。
  #
  # ruff 已于 2026-08-04 清零(#155/#157);ESLint 于 2026-08-05 清零
  # (#159/#161/#162),本步骤已启用 --max-warnings 0 并摘 continue-on-error。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # 脚本版本不可变门禁要跟 base ref 做三点 diff,浅克隆拿不到 merge-base
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint -- --max-warnings 0

      - name: Install ruff
        # 从 dev lock 取精确版本(而非 requirements-dev.txt 的区间),与其他 job
        # 同一套锁定依赖。-oE 只取 `ruff==x.y.z`:lock 里该行以续行符结尾,
        # 直接 grep 整行会把尾部 ' \' 带进 pip 参数。
        #
        # 与本地的关系:**方向通常是安全的,但不是保证**。
        # 本地走 `pip install -r requirements-dev.txt`,拿到的是区间内最新版,
        # 所以「刚装过」时本地 ruff >= CI ruff —— 本地只会更严,不会更松。
        #
        # 但环境放久了不升级就会反过来:实测本机 venv 曾长期停在 0.16.2(区间
        # `>=0.16.2,<1.0` 的下界),而 CI 锁的是 0.16.5 —— 那就是本地比 CI 松,
        # 「本地全绿、推上去才红」完全可能发生。所以别把上面那句当成保证。
        #
        # 要排查这类不一致,或想让本地与 CI 逐个版本对齐,直接装 lock:
        #   pip install --require-hashes -r backend/requirements-dev.lock
        run: pip install "$(grep -oE '^ruff==[^ ]+' backend/requirements-dev.lock)"
      - name: Ruff
        run: ruff check backend/ tools/ scripts/

      # 前端死文件/死依赖（G23 收尾，issue #459 状态评论）：实测 0.9s；
      # 粒度收窄为 files+dependencies，取舍见
      # docs/notes/process/2026-08-14-dead-code-knip.md
      - name: knip 死代码检查
        working-directory: frontend
        run: npm run --silent knip

      # 这条**阻塞**:不是风格建议,是二值门禁,且当前全仓已清零。
      # pre-commit 钩子需开发者手动 `git config core.hooksPath .githooks`
      # 才生效 —— pipeline_engine.py 当年就是这么漏进来的,CI 侧兜底。
      # 前端也要扫:历史上撞坏 diff 的 PlanEditPage.tsx 就是 .tsx
      # (见 .gitattributes 与 README「EOL 与污染防御」)。非 .py 只检测不改写。
      - name: 空行注入污染检查
        run: |
          find backend tools scripts frontend/src -type f \
            \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' \
               -o -name '*.js' -o -name '*.jsx' \) \
            -not -path '*/resources/*' -not -path '*/__pycache__/*' \
            -not -path '*/node_modules/*' \
            | xargs python tools/dev/collapse-blank-pollution.py --check -q

      # 这条也**阻塞**:ADR-0020 规定已发布的脚本版本目录内容不可变。
      # 2026-07-31 生产事故就是 ef8808e 的 `ruff --fix` 原地改写了这些目录,
      # 导致 18/27 行 script 的 DB sha 与磁盘永久对不上、全平台派发中断。
      # ruff.toml 已把该目录加进 extend-exclude,这条是兜底(手改同样拦)。
      - name: 脚本版本不可变检查(ADR-0020)
        run: |
          python tools/dev/check-script-version-immutability.py \
            --base "origin/${{ github.base_ref || github.ref_name }}"

      # 治理面结构门禁（synthesis C-G1 L0）：CLAUDE.md @import 行内失效类事故的
      # 确定性拦截 + pr-agent 防绕过机制锚点守卫。检查器自身由 --self-test
      # 正反样例守护；S 规则明细见 tools/dev/check_governance_surface.py 抬头。
      - name: 治理面结构检查(C-G1 L0)
        run: |
          python tools/dev/check_governance_surface.py --check

      # 这条**阻塞**：仓库保持 public（2026-08-29 决策），真实内网主机地址
      # 一旦写进文档/代码就等于公开资产清单。历史累积过两轮人工清理
      # （#550 全泛化 172.21.x.x、#557 补 172.16 网段），没有门禁就会再来一次。
      # 只拦「四段齐全的具体主机地址」：CIDR 网段常量（172.16.0.0/12）、
      # Docker 默认网关（172.17.0.1）、回环/通配一律放行；ADR-0020 脚本目录
      # 与已锁定迁移因物理不可改写走白名单。文档示例请用 RFC 5737
      # 文档保留段（192.0.2.0/24），它不在 RFC1918 内故天然放行。
      # 正反样例自证：python tools/dev/check-internal-ip-leak.py --self-test
      - name: 内网主机地址检查(public 仓库)
        run: |
          python tools/dev/check-internal-ip-leak.py --check

  # ── PR 轻量检查 ──────────────────────────────────────────────────────────
  # pull_request 只跑 lint（上方，两边都跑）+ 下面四个 job（pr-agent-tests /
  # pr-migrate-empty-db / pr-typecheck / pr-compileall）；
  # 全量 backend-test/frontend-check/docker-build 由 main-ci-backstop 夜间兜底。
  # 例外：lock 卫生测试随 pr-agent-tests 前移（见该 job 内注释）。
  # 风险：PR 合入前不跑 backend/tests、vitest / docker build，
  # 由合入 main 后的全量兜底；若要“合并前全量”应改用 Merge Queue。
  pr-agent-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 部分 agent 测试模块 import 时会解析 DATABASE_URL，但不会真正连接；
      # 与全量 backend-test 保持一致的环境可避免收集期 RuntimeError。
      TESTING: "1"
      JWT_SECRET_KEY: "ci-test-secret-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install dependencies
        run: pip install --require-hashes -r backend/requirements-dev.lock
      - name: Run agent tests
        run: python -m pytest backend/agent/tests/ -q
      # 两份 lock 卫生测试前移到 PR 路径：改 requirements(.dev).txt 而未重生成
      # lock 的失败此前只在夜间 backend-test 才红（2026-08-30/08-31/09-01 三次
      # 全量失败中的两次即此形态，main 最长红了 14 小时）。32 例纯离线
      # （无 DB/网络），实测 <1s，不破合并路径 ~2 分钟预算。只挑这两个文件，
      # 不整目录搬：tests/ 其余文件与迁移/部署契约耦合，需 PG 的依赖归夜间。
      - name: Run lock hygiene tests
        run: python -m pytest tests/test_requirements_lock.py tests/test_requirements_dev_lock.py -q

  # #510 教训（P0-2）：空库迁移守卫。独立 required check——上线即炸的空库
  # 迁移回归在 PR 上必拦；成本 ~1 分钟（含依赖安装），不跑整套 backend/tests。
  pr-migrate-empty-db:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stability_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      JWT_SECRET_KEY: "ci-test-secret-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/stability_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install dependencies
        run: pip install --require-hashes -r backend/requirements-dev.lock
      - name: Migrate empty PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Assert schema matches ORM models
        # #644 P0 复盘：pr-migrate-empty-db 原先只验「迁移能跑通」，不验
        # 「结果与模型一致」——uq_project_model_active 索引在生产丢失时
        # 空库守卫是绿的。基线白名单断言（diff ⊆ 基线）拦住新漂移。
        # 注意：不加 working-directory——python -m 把 cwd 放 sys.path[0]，
        # backend 包在仓库根。
        run: python -m backend.scripts.check_schema_sync

  pr-typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npm run type-check

  pr-compileall:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Compile check
        run: python -m compileall -q backend/ tools/ scripts/

  docker-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend-test, frontend-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t stability-backend .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t stability-frontend .
