name: PR update branch if behind

on:
  workflow_run:
    workflows: ["CI", "PR Agent (DeepSeek)", "CodeQL"]
    types: [completed]

permissions: {}

concurrency:
  group: pr-update-branch-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  update-if-behind:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: scripts/ci/pr-update-branch-if-behind.sh
          sparse-checkout-cone-mode: false
      - name: Update branch when green and behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/ci/pr-update-branch-if-behind.sh
