name: PR update branch if behind

on:
  workflow_run:
    workflows: ["CI", "PR Agent (DeepSeek)", "CodeQL"]
    types: [completed]

permissions: {}

# 与 enable-auto-merge.yml 共用同一个 group：两个 workflow 都跑
# scripts/ci/pr-automerge-queue.sh，对同一个队首并发调 updatePullRequestBranch
# 时，落败方会拿到 "head sha didn't match the current head ref"（run 33269782605）。
# 全局串行是消除该竞态的主手段；脚本内对竞争错误另有容错兜底。
# 代价：本 workflow 内第二个 step（按触发分支更新）也被一并串行，单 job ~10s，
# 队列长度受 open PR 数约束，可接受。
concurrency:
  group: pr-automerge-queue
  cancel-in-progress: false

jobs:
  update-if-behind:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: |
            scripts/ci/pr-update-branch-if-behind.sh
            scripts/ci/pr-automerge-queue.sh
            scripts/ci/approve-pending-workflow-runs.sh
          sparse-checkout-cone-mode: false
      - name: Reconcile queue and update head if behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/pr-automerge-queue.sh
      - name: Update branch when green and behind (workflow_run PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/ci/pr-update-branch-if-behind.sh
