# 可复现构建用的**开发 / CI 依赖**锁定清单 —— **不要手工编辑**。
#
# 与 requirements.lock 的分工(两份是并列关系,不是同一份的两个视图):
#   requirements.txt      → requirements.lock      生产镜像(Dockerfile.backend)
#   requirements-dev.txt  → requirements-dev.lock  CI 各 job(--require-hashes)
#
# requirements-dev.txt 用 `-r requirements.txt` 把运行时依赖整份拉进来,再叠
# pytest / pytest-asyncio / testcontainers / ruff / pytest-cov,所以本文件是
# requirements.lock 的超集 —— 那边有的这里全都有。
#
# 生成方式(**必须按 py3.11 解析**:CI 的 setup-python 与 Dockerfile.backend
# 都是 3.11,按别的版本解析出的 wheel 组合可能在目标环境装不上):
#
#     uv pip compile --python-version 3.11 --generate-hashes --strip-extras \
#       --output-file requirements-dev.lock requirements-dev.txt
#
# 为什么用 uv 而不是 pip-tools:同一份输入,uv 数秒完成,pip-compile 实测
# 30 分钟以上仍卡着(--generate-hashes 要顺序请求每个候选版本的元数据,
# 期间 CPU 近乎空转)。两者输出格式(--hash / `# via`)兼容,下游工具无感。
# 若哪天必须换回 pip-tools,命令见 requirements.lock 抬头,把输入文件名替换掉即可。
#
# 生成后必须补写摘要(否则 tests/test_requirements_dev_lock.py 会失败):
#
#     python tools/dev/requirements_digest.py \
#       backend/requirements-dev.txt backend/requirements-dev.lock --stamp
#
# ⚠️ --stamp 是「给任何文件盖章」,它不检查 lock 内容是否真的对应当前
# requirements —— 只跑 --stamp 而不重新生成,会让同步测试假通过,而 CI 装的
# 其实已经不是这一版解析出来的依赖了。掉进这个坑的迹象是:测试全绿,但
# lock 里的版本明显落后于上游。先生成,再 --stamp,顺序不能反。
#
# 校验安装:pip install --require-hashes -r requirements-dev.lock
# 校验新鲜度:python tools/dev/requirements_digest.py \
#             backend/requirements-dev.txt backend/requirements-dev.lock --check
