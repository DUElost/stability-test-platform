# 控制面宿主硬件 watchdog —— 卡死自复位，不再等人按电源。
# Rendered by the site installer for <deploy-root> — do not edit by hand.
# 事实源：本文件；S2 渲染、S4 落盘后 `daemon-reexec` 并回读 RuntimeWatchdogUSec 验证生效。
# 关联：#3200、docs/operations/incident-2026-07-28-host-9-126-hard-hang-and-bios-upgrade.md §3.1
#
# 判据：2026-09-23 13:42–13:46 整机失速（journald / 监控抓取 / SSH 全停，无 panic、
#   无 OOM-kill、无 MCE，pstore 空），wtmp 标 `crash`，只能人工强制重启。
#   07-28 那台 agent host 硬挂当天就配了狗，但那四项加固**只作用于该机**，控制面宿主
#   一直没装——这就是「每次卡死都要人肉到场 4 分钟」的直接原因。
[Manager]
# 30s 而非 .126 的 10s：控制面宿主常同机承载 PostgreSQL / NFS / 控制面 API，短周期在
# 正常 IO 突发下有**误复位**风险；30s 仍远快于任何人工发现路径（本次失速实测 3.5–4 分钟）。
RuntimeWatchdogSec=30s
# systemd 257 **没有** `ShutdownWatchdogSec` 这个键（写了被静默忽略，实测修正）：
# 重启/关机路径的超时统一由 RebootWatchdogSec 管，10min 覆盖「慢但正当」的 flush 与回收。
RebootWatchdogSec=10min
KExecWatchdogSec=2min
WatchdogDevice=/dev/watchdog
