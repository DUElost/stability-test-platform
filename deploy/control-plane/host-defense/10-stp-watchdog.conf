# 控制面宿主硬件 watchdog —— 卡死自复位，不再等人按电源。事实源（非本机运行副本）。
# 关联：#3200、docs/operations/incident-2026-07-28-host-9-126-hard-hang-and-bios-upgrade.md §3.1
# 判据：2026-09-23 13:42–13:46 整机失速（journald/Prometheus 抓取/SSH 全停，无 panic、
#       无 OOM-kill、无 MCE，pstore 空），wtmp 标 `crash` ⇒ 只能强制重启。
#       07-28 `.126` 那次硬挂当天就配了 watchdog，但那四项加固**只作用于那台 agent host**，
#       控制面宿主一直没装——这是「每次卡死都要人肉 4 分钟」的直接原因。
# 安装与验证见同目录 README.md（尚未进安装清单，#3200 T1 尾账）。
[Manager]
# 30s 而非 .126 的 10s：本机同机承载 PostgreSQL + NFS 导出 + 控制面 API，短周期在正常
# IO 突发下有**误复位**风险；30s 仍远快于任何人工发现路径（本次失速实测 3.5–4 分钟）。
RuntimeWatchdogSec=30s
# 重启/关机路径的超时由 RebootWatchdogSec 管：**systemd 257 没有 `ShutdownWatchdogSec`
# 这个键**（写了被静默忽略，本次实测修正），10min 覆盖 PG flush + 大 swap 回收的「慢但正当」。
RebootWatchdogSec=10min
KExecWatchdogSec=2min
WatchdogDevice=/dev/watchdog
