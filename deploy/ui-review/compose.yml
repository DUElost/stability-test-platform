services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
  redis:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
  server:
    image: stp-ui-review-server:${UI_REVIEW_SHA:?}
    restart: unless-stopped
    env_file: !reset []
    environment:
      ENV: development
      AUTH_COOKIE_SAMESITE: lax
      STP_CSRF_ENABLED: "1"
      STP_ALLOW_REGISTER: "0"
      AUTH_ACCESS_COOKIE_NAME: stp_ui_review_access
      AUTH_REFRESH_COOKIE_NAME: stp_ui_review_refresh
      CORS_ORIGINS: ${UI_REVIEW_ORIGIN:?}
      JWT_SECRET_KEY: ${UI_REVIEW_JWT_SECRET:?}
      AGENT_SECRET: ${UI_REVIEW_AGENT_SECRET:?}
      LOG_BASE_DIR: /var/lib/stp-dev/logs
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/stp-dev:mode=1777,size=64m
    mem_limit: 1g
    memswap_limit: 1g
    command: >
      sh -ec "mkdir -p /var/lib/stp-dev/nfs /var/lib/stp-dev/aee-nfs /var/lib/stp-dev/aee-local
      && python /app/backend/scripts/init_dev_db.py
      && exec python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000"
  frontend:
    image: stp-ui-review-frontend:${UI_REVIEW_SHA:?}
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:15179:80"
    volumes:
      - ./ui-review-public:/usr/share/nginx/html/ui-review:ro
    networks:
      - default
      - browser_ingress
    mem_limit: 128m
    memswap_limit: 128m
  fixtures:
    image: stp-ui-review-server:${UI_REVIEW_SHA:?}
    network_mode: service:server
    depends_on:
      server:
        condition: service_healthy
    environment:
      AGENT_SECRET: ${UI_REVIEW_AGENT_SECRET:?}
    volumes:
      - ./tools/dev/fake_agent.py:/app/tools/dev/fake_agent.py:ro
      - ./ui-review-fixtures.py:/app/ui-review-fixtures.py:ro
    command: python /app/ui-review-fixtures.py
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m

networks:
  default:
    internal: true
  browser_ingress:
