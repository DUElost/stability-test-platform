# Prometheus AlertManager rules for stability-test-platform.
# Rendered by the site installer for <deploy-root> — do not edit by hand.
#
# 这份仓库文件是唯一事实源：站点侧 /etc/stp/prometheus/rules/*.yml 只是安装产物。
# 由 tools/site_config/stages.py 的 MONITORING_RULES 安装，并由 prometheus.yml 的
# rule_files 段加载。两者缺一，规则就只活在仓库里——#2488 之前正是那种状态：
# 仓库里的告警一条也没上线，本机那份手工拷贝停在旧条数（当时的具体数字见 #2488 的 Note）。
# 改 labels/severity 请改这里，并同步重跑 promtool test rules（场景文件必须跟着改）。
#
# 去向提醒（#2643）：本文件**整份**被安装到站点，而站点的抓取面只有本机 node-exporter
# （`deploy/prometheus/prometheus.yml` 单 job）。因此引用控制面 `stability_*` 指标的规则在站点
# **恒无样本**——不触发也不报错。这类规则由 `tests/test_site_alert_scrape_surface.py` 逐条登记，
# 只准缩短不准扩大；「站点只装站点可见面规则」还是「站点补控制面 /metrics 抓取」属方向裁决，
# 由 #2643 的 owner 定。新增规则时请先想清楚它属于哪一面。

groups:
  - name: stability-platform-main-chain
    rules:
      - alert: StabilityPlanRunAggregationFailed
        expr: increase(stability_plan_run_aggregation_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PlanRun terminal aggregation failed
          description: >-
            stability_plan_run_aggregation_failed_total increased in the last 15m.
            Check backend logs for plan_run_aggregation errors.

      - alert: StabilityPostCompletionEnqueueFailed
        expr: increase(stability_post_completion_enqueue_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: post_completion SAQ enqueue failures
          description: >-
            Jobs reached terminal state but post_completion_task enqueue failed.
            Recycler may backfill; investigate Redis/SAQ worker health.

      - alert: StabilityClaimLeaseFailedSpike
        expr: rate(stability_claim_lease_failed_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Elevated device lease claim conflicts
          description: >-
            Agents are failing to acquire leases (device already leased).
            May indicate stale leases or dispatch overlap.

      # #77：理论漂移率 = 0——任何漂移都说明有入口绕开集中 terminalization
      # 或出现并发 race。P3 warning（需排查但非即时）。
      # #1927：先 sum by (mode) 归并——逐 series 阈值会在系统性漂移时按
      # run 实例化告警风暴（label 已收敛为 mode，此处防御性聚合）。
      - alert: StabilityPlanRunCounterDrift
        expr: sum by (mode) (increase(stability_plan_run_counter_drift_total[1h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PlanRun terminalization counter drift repaired
          description: >-
            counter_reconciler repaired drift in PlanRun job counters. All
            terminal paths must go through the central terminalization service
            (ADR-0026 §6) — investigate which entry bypassed it or which
            concurrent race lost an update. SLO: drift ratio P99 < 0.1%;
            escalate when > 1%.

  - name: stability-platform-security
    rules:
      - alert: StabilityCsrfOriginRejected
        expr: rate(stability_csrf_rejected_total{reason="origin_not_allowed"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CSRF origin rejections spike
          description: >-
            Possible cross-origin attack or misconfigured frontend Origin.
            Verify CORS allowlist matches deployed UI URL.

      - alert: StabilityCsrfMissingOriginReferer
        expr: rate(stability_csrf_rejected_total{reason="missing_origin_and_referer"}[5m]) > 50
        for: 10m
        labels:
          severity: info
        annotations:
          summary: CSRF missing Origin/Referer probes
          description: >-
            High rate of script/probe traffic without browser Origin headers.

  - name: stability-platform-dispatch
    rules:
      - alert: StabilityDispatchGateFailed
        expr: increase(stability_dispatch_gate_runs_total{outcome="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Plan dispatch gate failure
          description: >-
            One or more Plan dispatch gates failed.  Check plan_precheck logs
            and verify host/script readiness.

      - alert: StabilityDispatchGateSlow
        expr: histogram_quantile(0.95, rate(stability_dispatch_gate_duration_seconds_bucket[10m])) > 30
        for: 10m
        labels:
          severity: info
        annotations:
          summary: Dispatch gate P95 latency above 30s
          description: >-
            Plan dispatch gate is taking longer than expected.  May indicate
            slow SSH/ADB verification or NFS latency.

  - name: stability-platform-agent
    rules:
      - alert: StabilityPatrolStall
        # streak 是 Histogram：_count − _bucket{le="1"} = 连续失败 ≥2 的观测数
        # （基础名不是可查询序列，裸用会静默永不触发——#1257；两侧 sum()
        # 归并标签，否则 le 标签不对称会使减法恒为空向量）
        expr: >-
          sum(increase(stability_patrol_failure_streak_observed_count[15m]))
          - sum(increase(stability_patrol_failure_streak_observed_bucket{le="1"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Patrol failure streak observed
          description: >-
            A device patrol loop hit consecutive failures.  Agent should have
            entered BACKOFF; check device health and script functionality.

      - alert: StabilitySaqQueueDepth
        expr: stability_saq_queue_depth > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SAQ queue backlog exceeds 50
          description: >-
            Post-completion / notification tasks are piling up.  Check Redis
            connectivity and SAQ worker concurrency.

      - alert: StabilityHostHeartbeatTimeout
        expr: increase(stability_apscheduler_job_runs_total{job_name="session_watchdog",outcome="error"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Session watchdog job errors
          description: >-
            The session_watchdog APScheduler job reported errors.  Hosts may
            not be timed out correctly.  Check watchdog logs.

      # #743（follow-up #729）：幽灵 `/complete` 404 风暴持续约一个月才被日志审查发现
      # ——此前心跳已上报积压但**无告警**。标签名以注册表为准 = `type`（#743 正文写的是
      # `outbox_type`；契约测试 tests/test_prometheus_alerts_contract.py 会拦未知标签）。
      - alert: StabilityAgentTerminalOutboxBacklog
        expr: stability_agent_outbox_pending{type="terminal"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Agent terminal outbox backlog not draining (30m)
          description: >-
            An Agent has held un-acked terminal outbox rows for 30m.  Usually the
            centre answers 404/misroute for POST .../jobs/*/complete (the #729
            ghost 404 storm): check centre routing first.  Before clearing any
            centre-side job rows, read docs/operations/control-plane-db-maintenance.md.

  - name: stability-platform-silent-skips
    rules:
      # 稳态不该出现的桶（#518 教训：静默跳过只记日志无人盯 → 指标化）。
      # merge_skip_no_org_files / merge_skip_failed_plan_run 是预期路径，只计数不告警。
      - alert: StabilityMergeSkipToolNotConfigured
        expr: increase(stability_merge_skip_tool_not_configured_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Merge skipped because scan tool not configured
          description: >-
            STP_BACKEND_DEDUP_SCAN_* missing → resolve_scan_tool() returned None
            and merge silently skipped.  Check production .env.backend and run
            tools/dev/check-deploy-readiness.py (required-env blocking check).

      - alert: StabilityUnlinkedFixable
        expr: increase(stability_unlinked_fixable_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Unlinked fixable signal observed
          description: >-
            Watcher-summary computed unlinked_fixable > 0 (#528 threshold).
            A matching DLE exists yet the signal link is missing — check
            signal_link_reconcile_done logs and backend/scheduler/signal_link_reconciler.py.

      # #743 期望 2（follow-up #729）：控制面幽灵 `POST .../jobs/*/complete` 的 404 速率。
      # #729 的 404 风暴持续约一个月才靠翻日志发现——本组正是「只记日志无人盯」的收敛处。
      #
      # 端点标签来源见 backend/core/request_metrics.py：命中路由用**模板**，未命中
      # （正是本告警要抓的幽灵端点形态）用**归一化路径**，故
      # `/api/v1/jobs/12345/complete` 计为 `/api/v1/jobs/{id}/complete`，基数有界。
      #
      # 阈值：稳态为 0；0.02 req/s ≈ 1.2 次/分，出现即说明有客户端在打不存在的端点。
      - alert: StabilityGhostJobCompleteEndpoint
        expr: rate(stability_api_requests_total{status_code="404", endpoint=~".*/complete"}[5m]) > 0.02
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Ghost POST .../jobs/*/complete 404 storm (control plane)
          description: >-
            The control plane has answered 404 for POST .../jobs/*/complete at a
            sustained rate.  This is the #729 形态：旧 Agent/客户端在打已不存在的
            `/complete` 端点。核对 Agent 版本与中心路由表；处置前先读
            docs/operations/control-plane-db-maintenance.md（不要手动删 job 行）。

  - name: stability-platform-database
    rules:
      # #1958：Job/Lease 锁序死锁曾持续复发约四周，而平台侧零指标零告警——
      # 它只在 PostgreSQL 服务端日志里可见，受害事务还可能被上层通用 except
      # 吞掉（回收器的逐候选失败分支即如此），业务侧只剩零散 500。
      # 稳态为 0：出现即说明两条并发路径对同一批行以相反顺序加锁（环路等待），
      # PG 已回滚其中一方。
      - alert: StabilityDbDeadlockDetected
        expr: increase(stability_db_deadlock_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend observed a PostgreSQL deadlock (SQLSTATE 40P01)
          description: >-
            Backend 观察到数据库死锁增量。先核对同一批行上两条并发路径的加锁
            顺序是否相反（必须全局同一全序）：租约/作业类是
            POST /agent/leases/extend-batch（Job→Lease）与
            backend/scheduler/device_lease_reconciler.py 的过期回收；
            终态化类是 plan_run / plan_run_host / job_instance。
            注意被回滚的一方可能把异常吞进通用 except（日志会记成别的 error
            名），不要只按业务返回码判断。

      # #2104：锁序修复（#1959/#1980/#1985/#2022）把**环路等待**消掉了，代价会转移到
      # **普通等待**——它对 stability_db_deadlock_total 完全不可见。若不单独盯，
      # 「死锁计数为 0」就会被读成「无代价」，正是本仓反复出现的「绿而空」形态。
      # 阈值取「有查询在锁上等 >30s 且持续 5m」：单次 NFS 长回收可能造成秒级等待
      # （stability_retention_txn_seconds 可观），到不了 30s；到得了就是真实争用或长持锁。
      - alert: StabilityDbLockWaitSustained
        expr: max_over_time(stability_db_lock_wait_max_seconds[10m]) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL lock wait sustained over 30s
          description: >-
            有会话在行锁上排队超过 30 秒。锁序修复后死锁应归零，代价会表现为等待：
            先看 stability_retention_txn_seconds（保留清理的持锁窗口，NFS 目录回收仍在
            同一事务内）与 stability_db_lock_waiters（等待会话数）；再按
            docs/notes/architecture/2026-09-14-shared-row-lock-table.md 的 I1–I4 核对
            是否出现新的加锁顺序反向。

      # ---- #2881 skill 用量探针的执行者指标 --------------------------------------
      # 生产者 = tools/dev/skill_usage_probe.py 的 node-exporter textfile（不是 backend
      # 应用指标）。名字由 tests/metrics_registry.py 的 textfile_metric_index() 从生产者
      # 源码静态提取，因此同样受「未知指标即红」的结构层约束——不是豁免口子。
      # hollow 是周级事实（skill 建而不用），故给 7 天持续窗口而不是立刻响。
      - alert: StabilitySkillUsageHollow
        expr: stp_skill_usage_hollow > 0
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: 有 skill 达到观察窗且从未被强信号触发（HOLLOW）
          description: >-
            stp_skill_usage_hollow 连续 7 天大于 0。处置二选一：删除该 skill，或改写
            description 让触发词真实可命中（design/2026-08-governance-surface-protection.md
            §8.1 观察台账）。删前核对 Codex 列会话性质（读取≠触发，审计噪声未甄别）。
            探针只报告，不自动删除任何 skill。

      # 四种不可信形态合成一条（避免告警风暴）：探针崩了（broken）、强信号源不在场
      # （unknown ⇒ 洞数未知，不得当成 0）、以及「探针其实没在跑」（last_run 陈旧或指标
      # 消失）。最后一条尤其要紧——停摆时 hollow=0 仍会被读到，看起来像「干净」。
      # 阈值 172800s = 48h：探针每周一次 + Persistent=true 补跑，两天无结果即真停摆。
      - alert: StabilitySkillUsageUntrusted
        expr: stp_skill_usage_broken == 1 or stp_skill_usage_unknown == 1 or time() - stp_skill_usage_last_run > 172800 or absent(stp_skill_usage_last_run)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: skill 用量探针不可信（崩溃／源不可得／停摆）
          description: >-
            broken=1（探针自身异常）、unknown=1（强信号源不在场，洞数未知）或 last_run
            超过 48 小时未更新／指标消失。此时 hollow 的读数没有意义：先修探针或确认转录源
            仍在（--home 指向的部署用户家目录），并确认 stp-skill-usage.timer 在跑。

      # ---- #735 退役守卫的执行者指标 -------------------------------------------
      # 生产者 = tools/dev/script_guard_probe.py 的 node-exporter textfile（不是 backend
      # 应用指标）。名字由 tests/metrics_registry.py 的 textfile_metric_index() 从生产者
      # 源码静态提取，因此同样受「未知指标即红」的结构层约束——不是豁免口子。
      # 守卫只读：due>0 的含义是「有版本待**人工授权**退役」，不是可以自动下手的信号。
      - alert: StabilityScriptGuardRetirementDue
        expr: stp_script_guard_due > 0
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: 脚本退役守卫发现待授权退役版本
          description: >-
            stp_script_guard_due 连续 7 天大于 0。退役是人工授权动作：先跑
            tools/dev/retire_script_versions.py plan 出 manifest，复核后 execute --yes。
            巡检任务永不写库，due 也不得被当成自动退役的许可。

      # 四种不可信形态合成一条（避免告警风暴）：工具崩了（broken）、执行事实拿不到（unknown）、
      # 以及「守卫其实没在跑」（last_run 陈旧或指标整个消失）。最后一条尤其要紧——停摆时
      # due=0 仍会被读到，看起来像「干净」，正是本仓反复出现的「绿而空」形态。
      # 阈值 172800s = 48h：probe 每日一次 + Persistent=true 补跑，两天无结果即真停摆。
      - alert: StabilityScriptGuardUntrusted
        expr: stp_script_guard_broken == 1 or stp_script_guard_unknown == 1 or time() - stp_script_guard_last_run > 172800 or absent(stp_script_guard_last_run)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 脚本退役守卫不可信（崩溃／事实不可得／停摆）
          description: >-
            broken=1（工具自身异常）、unknown=1（执行事实维度不可得）或 last_run 超过 48
            小时未更新／指标消失。此时 due 的读数没有意义，不得据此退役任何版本：先修
            probe 或判据端，并确认 stp-script-guard.timer 仍在运行。

      # #2394①：UNISOC「落成未采到」积压。gauge = 该 host 最近一个**完成**的
      # UNISOC job 收尾拍快照（列举到但未落 processed 且未放弃的目录数）。
      # 12h 依据：压测 host 一天内多个 job 终态会反复刷新；持续 12h 说明
      # 「末次完成后仍有欠账、且此后没有一次干净完成」——真实积压或大目录
      # 持续降级失败的共同形态。注意**空闲 host 语义**：无新 job 则 gauge 不
      # 更新（stale gauge 可因时钟假触发），排查第一步看该 host 近期是否有过
      # job 终态（见 description），不要直接当设备故障。
      - alert: StabilityUnisocUnresolvedBacklog
        expr: stability_reconciler_unresolved_dirs > 0
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: UNISOC watcher left unresolved event dirs at last completed job
          description: >-
            该 host 最近完成的 UNISOC job 收尾时仍有「设备列到、平台未落账」的事件目录。
            先排除 stale gauge（该 host 是否 12h 内本应有 job 终态）；再看 agent 日志
            unisoc_reconciler_unresolved_dir / dir_abandoned 定位具体目录；正常形态下
            #2252 降级与 #2079 重试会在数拍内收敛，持续积压提示新型不可收敛目录。
            判据与失效面：docs/notes/bug-fix/2026-09-14-unisoc-anomaly-source-73.md
            与 issue #2394。

      # #2252 回归防线：du 预探测 + 仅元数据降级上线后，abandoned（连败止损放弃）
      # 应长期归零；一旦复现即「尺寸守卫未覆盖 / 降级取元数据也失败」的新形态，
      # 是效率路径被打破的硬信号，需要人工介入而非等待自愈。
      - alert: StabilityUnisocDirAbandonedRegression
        expr: increase(stability_reconciler_dirs_abandoned_total[6h]) > 0
        labels:
          severity: warning
        annotations:
          summary: UNISOC event dir abandoned reappeared after #2252
          description: >-
            #2252 后仍出现「连败达上限被放弃」的目录：检查该目录 unievent_info 是否
            连元数据都拉不回（设备侧损坏/权限），或 du 探测失手回落整拉后仍恒超时。
            agent 日志 grep unisoc_reconciler_dir_abandoned 取目录名与 attempts。

      # #2632 缺口①：PG 日志里的「猜 schema」指纹（观测先行）。
      # 生产者 = tools/dev/pg_error_guard.py 的 node-exporter textfile——名字由
      # tests/metrics_registry.py 的 textfile_metric_index() 从生产者源码静态提取，
      # 因此同样受「未知指标即红」的结构层约束，不是豁免口子。
      # 阈值 5 条/小时：现场是 30 条量级的**聚集**；改走 SOP 的 information_schema
      # 首步之后，单次手误不报，避免对正当诊断刷屏。
      - alert: StabilityPgSchemaGuessing
        expr: stp_pg_schema_error_events >= 5 or time() - stp_pg_guard_last_run > 3600 or absent(stp_pg_guard_last_run)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 有人在对生产库跑「猜出来的 schema」（或采集器停摆）
          description: PG 日志最近一小时内出现 ≥5 条 schema 猜测指纹（猜表名 / 猜列 / 枚举值大小写）——这类错误**正常路径不应产生**（2026-09-16 的现场是约
            30 条聚集：表名两个方向都猜错、枚举用大写、引用当时未落地的列）。真正的问题是无留痕：若哪次猜对了，就是一次不留审计痕迹的生产读写。先按 docs/operations/production-diagnostics.md
            的只读口径复核（SOP 首步已改为先查 information_schema 求证表名/列名/枚举），再用 pg_stat_activity 的 application_name 归因来源；后半段条件（last_run
            超 1 小时 / 指标消失）表示采集器停摆——那时计数恒 0，看起来像「没人在猜」。

  # ---- #2754：单台 host 的 adb 通道批量失活（fleet 视角看不见的那一层）----
  # 起因：2026-09-18 host `192-0-2-81` 的 16 台里 15 台 adb offline，而平台上
  # **零告警**——host 状态 ONLINE、心跳新鲜、共享盘挂载正常，fleet 级
  # `stability_device_online{status=...}` 只是总数，看不见「聚集在哪一台」。
  # 这次是人读日志发现的（与 #2632 的「无留痕」同形：事实可观测，但没人被通知）。
  #
  # 阈值按当前 fleet 分布定（只读实测 46 台在册 host：每 host 设备数
  # min=3 / p10=11 / p50=16.5 / max=46）：
  #   offline ≥ 5  —— 绝对量下限，挡住小 host 的零星噪声（事故现场是 15 台）；
  #   占比 ≥ 0.5  —— 「多数不可达」才是通道层事件，个别设备掉线属设备侧问题；
  #   total  ≥ 5  —— 空 host / 刚接入未采到的 host 不误报。
  # **已知天花板**：3–4 台的小 host 全掉线不在本告警覆盖内（min=3 的 host 确实存在）；
  # 放宽下限要先看 fleet 里有多少 3–5 台的 host，别在告警里猜。
  - name: stability-platform-fleet-link
    rules:
      - alert: StabilityHostAdbOfflineConcentration
        expr: >-
          (
            sum by (host_id) (stability_host_device_adb_state{state="offline"}) >= 5
          )
          and
          (
            sum by (host_id) (stability_host_device_adb_state{state="offline"})
            /
            sum by (host_id) (stability_host_device_adb_state) >= 0.5
          )
          and
          (
            sum by (host_id) (stability_host_device_adb_state) >= 5
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Devices on one host are bulk adb-offline
          description: >-
            该 host 上 adb_state=offline 的设备已成多数（≥5 台且占比 ≥50%，持续 15m）。
            先按 docs/operations/production-diagnostics.md 的只读口径分清是哪一层：
            lsusb 设备在位 + adb server 存活 + `adb reconnect offline` 立即恢复 ⇒ adbd
            会话陈旧（#2754 的事故形态，非硬件）；lsusb 查无设备 ⇒ USB 枚举层，
            对照 docs/operations/incident-2026-07-29-host-8-87-xhci-death-and-adb-outage.md
            判据树。注意本告警**只观测**：平台侧自动 reconnect 未实现（会打断在跑的 job，
            需裁决，见 #2754 / #722）。
