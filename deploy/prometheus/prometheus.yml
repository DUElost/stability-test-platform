# Rendered by the site installer for <deploy-root> — do not edit by hand.
#
# 站点本地抓取配置（#2197）：admin 存储页（/storage）的数据源就是这里的 job。
# 后端默认按 http://127.0.0.1:9091 查询（STP_PROMETHEUS_URL 未设时），
# job 名 file-server 对应 STP_CONTROL_PLANE_NODE_JOB 的默认值，两者都不要再改：
# 改了要同步站点后端环境，否则页面会静默空掉。
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  # 中心化时用于区分站点来源；本站点自用不影响查询。
  external_labels:
    site: "<site-id>"

# 告警规则目录（与 config.file 同级的 rules/）：installer 把仓库里的
# deploy/prometheus/site-alerts.yml（**站点可见面子集**，#2643 方向 1）渲到
# etc/stp/prometheus/rules/。平台全量规则（alerts-stability-platform.yml）由控制面
# 自己的挂载路径承接（ADR-0011 待挂载），站点不装——它引用的控制面指标在这里
# 结构上无样本，装了只会让「监控就绪」看起来更完整。
# **没有这一段，规则装了也不会被加载**——#2488 之前模板里根本没有 rule_files，
# 于是按流程装出来的站点结构上不可能产生任何告警，而 installer 照样报 monitoring_ready
# （它只看服务起没起、/-/ready 通不通）。
rule_files:
  - rules/*.yml

scrape_configs:
  # 控制面与中心存储同机（方案 A 的 local_mount）：node-exporter 只听回环，
  # 不对外暴露指标端口。NFS 服务端指标（node_nfsd_*）也由这个 job 提供。
  - job_name: file-server
    static_configs:
      - targets: ["127.0.0.1:9100"]
