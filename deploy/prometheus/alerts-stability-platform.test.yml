    - series: stability_host_health_reason{host_id="192-0-2-90", reason="usb_link_degraded"}
      values: '0x70'
    alert_rule_test:
    - eval_time: 3m
      alertname: StabilityHostUsbControllerDead
      exp_alerts: []
    - eval_time: 10m
      alertname: StabilityHostUsbControllerDead
      exp_alerts:
      - exp_labels:
          severity: critical
          host_id: 192-0-2-63
          reason: usb_host_controller_dead
        exp_annotations:
          summary: Host USB controller is dead — the whole host is USB-blind
          description: 该 host 的内核报出 xHCI 主控死亡（`HC died; cleaning up`）**且此刻 USB 总线上 一台设备都看不到**。这不是 adb/adbd 问题：主控死了以后内核再也收不到任何 USB 事件，**不会自愈**，SSH 与心跳照常，平台侧只有这一条 reason 能表达它。 先按 docs/operations/host-device-visibility-triage.md 的 L1 层取证 （`journalctl -k | grep -E 'xhci|HC died'`），确认后用 unbind/rebind 救回 （fleet 已有两例当场恢复，23/23 设备回归），reboot 是兜底。 **不要自动 rebind**：会打断在跑的 job，自愈与否待本告警有数据后另议（#2900「不做什么」）。 这台机器的产能已归零，请把它从调度里摘掉再处理（设备租约见 device-lease-release SOP）。
    - eval_time: 40m
