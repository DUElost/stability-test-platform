        exp_annotations:
          summary: Devices on one host are bulk adb-offline
          description: >-
            该 host 上 adb_state=offline 的设备已成多数（≥5 台且占比 ≥50%，持续 15m）。
            先按 docs/operations/production-diagnostics.md 的只读口径分清是哪一层：
            lsusb 设备在位 + adb server 存活 + `adb reconnect offline` 立即恢复 ⇒ adbd
            会话陈旧（#2754 的事故形态，非硬件）；lsusb 查无设备 ⇒ USB 枚举层，
