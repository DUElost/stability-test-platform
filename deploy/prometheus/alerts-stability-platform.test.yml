# promtool 场景测试（#1257 / R14-F11）：规则必须在真实标签形状的样本上可触发。
# 覆盖面：#2151 建立时只覆盖「修过的规则」，#2236 把存量缺口补齐 → 现在
# **每条规则都有场景断言**（promtool 对未列规则不校验 = 零覆盖，所以
# 「全覆盖」本身就是判据，由 test_every_alert_rule_has_scenario_case 恒跑守住）。
# 条数不写死在这里（#2663）：写死的计数会随规则增长变成谎话，真值只能派生。
# 每条断言是否真有牙由 test_promtool_gate_detects_per_rule_threshold_drift 逐条自证。
# 运行：
#   promtool test rules deploy/prometheus/alerts-stability-platform.test.yml
# CI 由 tests/test_prometheus_alerts_contract.py 调度（runner 无 promtool 时
# 该子项跳过，结构层比对恒跑）。
rule_files:
  - alerts-stability-platform.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # StabilityDispatchGateFailed：修复前用了不存在的 status 标签
      - series: 'stability_dispatch_gate_runs_total{outcome="failed"}'
        values: '0+1x20'
      # StabilityPatrolStall：Histogram 只能经 _count/_bucket/_sum 使用；
      # le="1" 桶保持 0 → 观测到的 streak 全部 ≥2
      - series: 'stability_patrol_failure_streak_observed_count'
        values: '0+1x20'
      - series: 'stability_patrol_failure_streak_observed_bucket{le="1"}'
        values: '0x21'
      - series: 'stability_patrol_failure_streak_observed_bucket{le="+Inf"}'
        values: '0+1x20'
      # StabilityHostHeartbeatTimeout：修复前用了不存在的 job/status 标签
      - series: 'stability_apscheduler_job_runs_total{job_name="session_watchdog",outcome="error"}'
        values: '0+1x20'
      # StabilityAgentTerminalOutboxBacklog（#743）：心跳上报的积压保持 >0 超过 30m
      - series: 'stability_agent_outbox_pending{host_id="host-1",type="terminal"}'
        values: '1x40'
      # StabilityPlanRunCounterDrift（#77）：counter_reconciler 修复到一列漂移
      - series: 'stability_plan_run_counter_drift_total{mode="terminal"}'
        values: '0+1x20'
      # StabilityGhostJobCompleteEndpoint（#743 期望 2）：幽灵端点 404 持续。
      # 标签形状取自 backend/core/request_metrics.py 的接线：endpoint 是**路由模板化**
      # 之后的形态（`{id}` 而非具体 job id），因此基数有界。
      # 10/min = 0.167 req/s > 阈值 0.02，保持 15m 以上以满足 for。
      - series: 'stability_api_requests_total{method="POST",endpoint="/api/v1/jobs/{id}/complete",status_code="404"}'
        values: '0+10x30'
      # StabilityDbLockWaitSustained（#2104）：最长锁等待持续 40s——锁序修好后
      # 「死锁改等待」，这条是唯一能看见该代价的面
      - series: 'stability_db_lock_wait_max_seconds'
        values: '40x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: StabilityDispatchGateFailed
        exp_alerts:
          - exp_labels:
              outcome: failed
              severity: warning
            exp_annotations:
              summary: Plan dispatch gate failure
              description: >-
                One or more Plan dispatch gates failed.  Check plan_precheck logs
                and verify host/script readiness.
      - eval_time: 20m
        alertname: StabilityPatrolStall
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Patrol failure streak observed
              description: >-
                A device patrol loop hit consecutive failures.  Agent should have
                entered BACKOFF; check device health and script functionality.
      - eval_time: 20m
        alertname: StabilityHostHeartbeatTimeout
        exp_alerts:
          - exp_labels:
              job_name: session_watchdog
              outcome: error
              severity: warning
            exp_annotations:
              summary: Session watchdog job errors
              description: >-
                The session_watchdog APScheduler job reported errors.  Hosts may
                not be timed out correctly.  Check watchdog logs.
      - eval_time: 35m
        alertname: StabilityAgentTerminalOutboxBacklog
        exp_alerts:
          - exp_labels:
              host_id: host-1
              type: terminal
              severity: warning
            exp_annotations:
              summary: Agent terminal outbox backlog not draining (30m)
              description: >-
                An Agent has held un-acked terminal outbox rows for 30m.  Usually the
                centre answers 404/misroute for POST .../jobs/*/complete (the #729
                ghost 404 storm): check centre routing first.  Before clearing any
                centre-side job rows, read docs/operations/control-plane-db-maintenance.md.
      - eval_time: 20m
        alertname: StabilityPlanRunCounterDrift
        exp_alerts:
          - exp_labels:
              mode: terminal
              severity: warning
            exp_annotations:
              summary: PlanRun terminalization counter drift repaired
              description: >-
                counter_reconciler repaired drift in PlanRun job counters. All
                terminal paths must go through the central terminalization service
                (ADR-0026 §6) — investigate which entry bypassed it or which
                concurrent race lost an update. SLO: drift ratio P99 < 0.1%;
                escalate when > 1%.
      - eval_time: 20m
        alertname: StabilityGhostJobCompleteEndpoint
        exp_alerts:
          - exp_labels:
              method: POST
              endpoint: /api/v1/jobs/{id}/complete
              status_code: "404"
              severity: warning
            exp_annotations:
              summary: Ghost POST .../jobs/*/complete 404 storm (control plane)
              description: >-
                The control plane has answered 404 for POST .../jobs/*/complete at a
                sustained rate.  This is the #729 形态：旧 Agent/客户端在打已不存在的
                `/complete` 端点。核对 Agent 版本与中心路由表；处置前先读
                docs/operations/control-plane-db-maintenance.md（不要手动删 job 行）。
      - eval_time: 20m
        alertname: StabilityDbLockWaitSustained
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: PostgreSQL lock wait sustained over 30s
              description: >-
                有会话在行锁上排队超过 30 秒。锁序修复后死锁应归零，代价会表现为等待：
                先看 stability_retention_txn_seconds（保留清理的持锁窗口，NFS 目录回收仍在
                同一事务内）与 stability_db_lock_waiters（等待会话数）；再按
                docs/notes/architecture/2026-09-14-shared-row-lock-table.md 的 I1–I4 核对
                是否出现新的加锁顺序反向。

  # ── #2236：存量缺口清零（_SCENARIO_COVERAGE_DEBT 的 10 条）────────────────
  # 判据：promtool 对**未列进场景文件**的告警规则不校验，故阈值/时间窗漂移只在
  # 装了 promtool 的机器上偶发可见。这 10 条补齐后清单为空，任何新告警不补场景
  # 即被 test_every_alert_rule_has_scenario_case 拦红。
  # 输入序列的标签形状一律取自 `backend/core/metrics.py` 注册表 + 埋点侧常量，
  # **不照抄告警表达式**（表达式里的标签选择器可能是过期写法，#1927/#787 同型）：
  #   - engine  取 backend/core/database.py 的接线值（sync / async）
  #   - reason  逐字取 backend/core/csrf.py 的三个常量
  #   - outcome 取 backend/services/precheck/runner.py 的 gate_outcome
  #   - queue_name 取 SAQ_QUEUE_NAME 默认值 "stp"（生产者带标签，规则无匹配器）
  # 速率型阈值的换算：rate() 是**每秒**增量，故 > 0.1/s ⇒ 每分钟 ≥ 7 次、
  # > 10/s ⇒ 每分钟 660、> 50/s ⇒ 每分钟 3300（均留 ≥1.5x 余量）。
  # 直方图那条：全部观测落 (30,60] 桶 ⇒ P95≈58.5s > 30；le 取自指标 buckets 定义。
  - interval: 1m
    input_series:
    - series: stability_plan_run_aggregation_failed_total
      values: 0+1x20
    - series: stability_post_completion_enqueue_failed_total
      values: 0+1x20
    - series: stability_merge_skip_tool_not_configured_total
      values: 0+1x20
    - series: stability_unlinked_fixable_total
      values: 0+1x20
    - series: stability_db_deadlock_total{engine="sync"}
      values: 0+1x20
    - series: stability_claim_lease_failed_total
      values: 0+12x20
    - series: stability_csrf_rejected_total{reason="origin_not_allowed"}
      values: 0+660x20
    - series: stability_csrf_rejected_total{reason="missing_origin_and_referer"}
      values: 0+3300x20
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="0.5"}
      values: '0x21'
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="1.0"}
      values: '0x21'
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="2.5"}
      values: '0x21'
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="5.0"}
      values: '0x21'
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="10.0"}
      values: '0x21'
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="30.0"}
      values: '0x21'
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="60.0"}
      values: 0+1x20
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="120.0"}
      values: 0+1x20
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="300.0"}
      values: 0+1x20
    - series: stability_dispatch_gate_duration_seconds_bucket{outcome="failed",le="+Inf"}
      values: 0+1x20
    - series: stability_dispatch_gate_duration_seconds_count{outcome="failed"}
      values: 0+1x20
    - series: stability_dispatch_gate_duration_seconds_sum{outcome="failed"}
      values: 0+45x20
    - series: stability_saq_queue_depth{queue_name="stp"}
      values: 60x20
    alert_rule_test:
    - eval_time: 20m
      alertname: StabilityPlanRunAggregationFailed
      exp_alerts:
      - exp_labels:
          severity: warning
        exp_annotations:
          summary: PlanRun terminal aggregation failed
          description: stability_plan_run_aggregation_failed_total increased in the last 15m. Check backend logs for plan_run_aggregation errors.
    - eval_time: 20m
      alertname: StabilityPostCompletionEnqueueFailed
      exp_alerts:
      - exp_labels:
          severity: warning
        exp_annotations:
          summary: post_completion SAQ enqueue failures
          description: Jobs reached terminal state but post_completion_task enqueue failed. Recycler may backfill; investigate Redis/SAQ worker health.
    - eval_time: 20m
      alertname: StabilityMergeSkipToolNotConfigured
      exp_alerts:
      - exp_labels:
          severity: warning
        exp_annotations:
          summary: Merge skipped because scan tool not configured
          description: STP_BACKEND_DEDUP_SCAN_* missing → resolve_scan_tool() returned None and merge silently skipped.  Check production .env.backend and run tools/dev/check-deploy-readiness.py (required-env blocking check).
    - eval_time: 20m
      alertname: StabilityUnlinkedFixable
      exp_alerts:
      - exp_labels:
          severity: warning
        exp_annotations:
          summary: Unlinked fixable signal observed
          description: Watcher-summary computed unlinked_fixable > 0 (#528 threshold). A matching DLE exists yet the signal link is missing — check signal_link_reconcile_done logs and backend/scheduler/signal_link_reconciler.py.
    - eval_time: 20m
      alertname: StabilityDbDeadlockDetected
      exp_alerts:
      - exp_labels:
          engine: sync
          severity: warning
        exp_annotations:
          summary: Backend observed a PostgreSQL deadlock (SQLSTATE 40P01)
          description: Backend 观察到数据库死锁增量。先核对同一批行上两条并发路径的加锁 顺序是否相反（必须全局同一全序）：租约/作业类是 POST /agent/leases/extend-batch（Job→Lease）与 backend/scheduler/device_lease_reconciler.py 的过期回收； 终态化类是 plan_run / plan_run_host / job_instance。 注意被回滚的一方可能把异常吞进通用 except（日志会记成别的 error 名），不要只按业务返回码判断。
    - eval_time: 20m
      alertname: StabilityClaimLeaseFailedSpike
      exp_alerts:
      - exp_labels:
          severity: warning
        exp_annotations:
          summary: Elevated device lease claim conflicts
          description: Agents are failing to acquire leases (device already leased). May indicate stale leases or dispatch overlap.
    - eval_time: 20m
      alertname: StabilityCsrfOriginRejected
      exp_alerts:
      - exp_labels:
          reason: origin_not_allowed
          severity: warning
        exp_annotations:
          summary: CSRF origin rejections spike
          description: Possible cross-origin attack or misconfigured frontend Origin. Verify CORS allowlist matches deployed UI URL.
    - eval_time: 20m
      alertname: StabilityCsrfMissingOriginReferer
      exp_alerts:
      - exp_labels:
          reason: missing_origin_and_referer
          severity: info
        exp_annotations:
          summary: CSRF missing Origin/Referer probes
          description: High rate of script/probe traffic without browser Origin headers.
    - eval_time: 20m
      alertname: StabilityDispatchGateSlow
      exp_alerts:
      - exp_labels:
          outcome: failed
          severity: info
        exp_annotations:
          summary: Dispatch gate P95 latency above 30s
          description: Plan dispatch gate is taking longer than expected.  May indicate slow SSH/ADB verification or NFS latency.
    - eval_time: 20m
      alertname: StabilitySaqQueueDepth
      exp_alerts:
      - exp_labels:
          queue_name: stp
          severity: warning
        exp_annotations:
          summary: SAQ queue backlog exceeds 50
          description: Post-completion / notification tasks are piling up.  Check Redis connectivity and SAQ worker concurrency.

  # ---- #735 退役守卫（textfile 指标，生产者 tools/dev/script_guard_probe.py）----
  # 数值刻意选在「阈值上方一点、任何被抬高的阈值下方」：due=3 既能证明 `> 0` 有牙，
  # 又会在逐条变异（阈值→1e12）时不再触发，让 test_promtool_gate_detects_per_rule_threshold_drift
  # 能归因到本告警。`for: 7d` 用 interval 1h 覆盖（201 点 = 201h > 7d）。
  - interval: 1m
    input_series:
      - series: 'stp_script_guard_due'
        values: '3x12100'
      - series: 'stp_script_guard_broken'
        values: '0x12100'
      - series: 'stp_script_guard_unknown'
        values: '0x12100'
      # 巨大的 last_run：让 time() - last_run 始终为负，Untrusted 不因本块误触发
      - series: 'stp_script_guard_last_run'
        values: '99999999999x12100'
    alert_rule_test:
      # 6 天还在 for: 7d 之外——不得提前告警（否则「时间窗被改坏」看不见）
      - eval_time: 145h
        alertname: StabilityScriptGuardRetirementDue
        exp_alerts: []
      - eval_time: 170h
        alertname: StabilityScriptGuardRetirementDue
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 脚本退役守卫发现待授权退役版本
              description: >-
                stp_script_guard_due 连续 7 天大于 0。退役是人工授权动作：先跑
                tools/dev/retire_script_versions.py plan 出 manifest，复核后 execute --yes。
                巡检任务永不写库，due 也不得被当成自动退役的许可。

  # 工具崩了／事实不可得／指标陈旧／指标消失——四种不可信形态同属一条告警：本块只喂 broken=1
  - interval: 1m
    input_series:
      - series: 'stp_script_guard_due'
        values: '0x12100'
      - series: 'stp_script_guard_broken'
        values: '1x12100'
      - series: 'stp_script_guard_unknown'
        values: '0x12100'
      - series: 'stp_script_guard_last_run'
        values: '99999999999x12100'
    alert_rule_test:
      - eval_time: 30m
        alertname: StabilityScriptGuardUntrusted
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 脚本退役守卫不可信（崩溃／事实不可得／停摆）
              description: >-
                broken=1（工具自身异常）、unknown=1（执行事实维度不可得）或 last_run 超过 48
                小时未更新／指标消失。此时 due 的读数没有意义，不得据此退役任何版本：先修
                probe 或判据端，并确认 stp-script-guard.timer 仍在运行。

  # 全健康：四项都不该报。这条堵的是「把阈值放宽就永远绿」的假覆盖。
  - interval: 1m
    input_series:
      - series: 'stp_script_guard_due'
        values: '0x12100'
      - series: 'stp_script_guard_broken'
        values: '0x12100'
      - series: 'stp_script_guard_unknown'
        values: '0x12100'
      - series: 'stp_script_guard_last_run'
        values: '99999999999x12100'
    alert_rule_test:
      - eval_time: 200h
        alertname: StabilityScriptGuardUntrusted
        exp_alerts: []
      - eval_time: 200h
        alertname: StabilityScriptGuardRetirementDue
        exp_alerts: []

  # ---- #2881 skill 用量探针（textfile 指标，生产者 tools/dev/skill_usage_probe.py）----
  # 同 script-guard：hollow=3 选在「> 0 上方一点、任何被抬高的阈值下方」，既证明 `> 0` 有牙，
  # 又让逐条变异（阈值→1e12）能被归因到本告警；`for: 7d` 用 eval_time 145h/170h 卡两侧。
  - interval: 1m
    input_series:
      - series: 'stp_skill_usage_hollow'
        values: '3x12100'
      - series: 'stp_skill_usage_broken'
        values: '0x12100'
      - series: 'stp_skill_usage_unknown'
        values: '0x12100'
      # 巨大的 last_run：让 time() - last_run 始终为负，Untrusted 不因本块误触发
      - series: 'stp_skill_usage_last_run'
        values: '99999999999x12100'
    alert_rule_test:
      # 6 天还在 for: 7d 之外——不得提前告警（否则「时间窗被改坏」看不见）
      - eval_time: 145h
        alertname: StabilitySkillUsageHollow
        exp_alerts: []
      - eval_time: 170h
        alertname: StabilitySkillUsageHollow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 有 skill 达到观察窗且从未被强信号触发（HOLLOW）
              description: >-
                stp_skill_usage_hollow 连续 7 天大于 0。处置二选一：删除该 skill，或改写
                description 让触发词真实可命中（design/2026-08-governance-surface-protection.md
                §8.1 观察台账）。删前核对 Codex 列会话性质（读取≠触发，审计噪声未甄别）。
                探针只报告，不自动删除任何 skill。

  # 探针崩了／源不可得／指标陈旧／指标消失——四种不可信形态同属一条告警：本块只喂 broken=1
  - interval: 1m
    input_series:
      - series: 'stp_skill_usage_hollow'
        values: '0x12100'
      - series: 'stp_skill_usage_broken'
        values: '1x12100'
      - series: 'stp_skill_usage_unknown'
        values: '0x12100'
      - series: 'stp_skill_usage_last_run'
        values: '99999999999x12100'
    alert_rule_test:
      - eval_time: 30m
        alertname: StabilitySkillUsageUntrusted
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: skill 用量探针不可信（崩溃／源不可得／停摆）
              description: >-
                broken=1（探针自身异常）、unknown=1（强信号源不在场，洞数未知）或 last_run
                超过 14 天（2× 周级周期）未更新／指标消失。此时 hollow 的读数没有意义：先修探针或确认转录源
                仍在（--home 指向的部署用户家目录），并确认 stp-skill-usage.timer 在跑。

  # 全健康：四项都不该报（hollow=0 且各形态位为 0）。堵「把阈值放宽就永远绿」的假覆盖。
  - interval: 1m
    input_series:
      - series: 'stp_skill_usage_hollow'
        values: '0x12100'
      - series: 'stp_skill_usage_broken'
        values: '0x12100'
      - series: 'stp_skill_usage_unknown'
        values: '0x12100'
      - series: 'stp_skill_usage_last_run'
        values: '99999999999x12100'
    alert_rule_test:
      - eval_time: 200h
        alertname: StabilitySkillUsageUntrusted
        exp_alerts: []
      - eval_time: 200h
        alertname: StabilitySkillUsageHollow
        exp_alerts: []

  # #2977：缺源（unknown=1）时即便 hollow>0 也不得报 Hollow——只走 Untrusted。
  - interval: 1m
    input_series:
      - series: 'stp_skill_usage_hollow'
        values: '3x12100'
      - series: 'stp_skill_usage_broken'
        values: '0x12100'
      - series: 'stp_skill_usage_unknown'
        values: '1x12100'
      - series: 'stp_skill_usage_last_run'
        values: '99999999999x12100'
    alert_rule_test:
      - eval_time: 170h
        alertname: StabilitySkillUsageHollow
        exp_alerts: []
      - eval_time: 30m
        alertname: StabilitySkillUsageUntrusted
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: skill 用量探针不可信（崩溃／源不可得／停摆）
              description: >-
                broken=1（探针自身异常）、unknown=1（强信号源不在场，洞数未知）或 last_run
                超过 14 天（2× 周级周期）未更新／指标消失。此时 hollow 的读数没有意义：先修探针或确认转录源
                仍在（--home 指向的部署用户家目录），并确认 stp-skill-usage.timer 在跑。

  # #2394①/#2252 回归防线场景（覆盖两条新告警；host 标签形状取自
  # backend/core/metrics.py 的注册表定义）。
  - interval: 1m
    input_series:
      # unresolved 收尾快照恒为 3：12h 后触发积压告警
      - series: 'stability_reconciler_unresolved_dirs{host_id="host-1"}'
        values: '3x800'
      # abandoned 计数器前 60 分钟为 0，之后 +1：increase[6h]>0 恒触发
      - series: 'stability_reconciler_dirs_abandoned_total{host_id="host-1"}'
        values: '0x60 1x600'
    alert_rule_test:
      - eval_time: 13h
        alertname: StabilityUnisocUnresolvedBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              host_id: host-1
            exp_annotations:
              summary: UNISOC watcher left unresolved event dirs at last completed job
              description: >-
                该 host 最近完成的 UNISOC job 收尾时仍有「设备列到、平台未落账」的事件目录。
                先排除 stale gauge（该 host 是否 12h 内本应有 job 终态）；再看 agent 日志
                unisoc_reconciler_unresolved_dir / dir_abandoned 定位具体目录；正常形态下
                #2252 降级与 #2079 重试会在数拍内收敛，持续积压提示新型不可收敛目录。
                判据与失效面：docs/notes/bug-fix/2026-09-14-unisoc-anomaly-source-73.md
                与 issue #2394。
      - eval_time: 2h
        alertname: StabilityUnisocDirAbandonedRegression
        exp_alerts:
          - exp_labels:
              severity: warning
              host_id: host-1
            exp_annotations:
              summary: UNISOC event dir abandoned reappeared after #2252
              description: >-
                #2252 后仍出现「连败达上限被放弃」的目录：检查该目录 unievent_info 是否
                连元数据都拉不回（设备侧损坏/权限），或 du 探测失手回落整拉后仍恒超时。
                agent 日志 grep unisoc_reconciler_dir_abandoned 取目录名与 attempts。

  # ---- #2632 PG「猜 schema」指纹（textfile 指标，生产者 tools/dev/pg_error_guard.py）----
  # 与 #735 场景同款构造：`stp_pg_guard_last_run` 喂巨大值，让 `time() - last_run > 3600`
  # 与 `absent()` 两条分支**恒不成立**——场景判别的就只剩「计数 ≥ 5」这一条，逐条阈值
  # 变异（5 → 1e12）才能把本告警打红（test_promtool_gate_detects_per_rule_threshold_drift）。
  - interval: 1m
    input_series:
    - series: stp_pg_schema_error_events
      values: 6x40
    - series: stp_pg_guard_last_run
      values: 99999999999x40
    alert_rule_test:
    - eval_time: 5m
      alertname: StabilityPgSchemaGuessing
      exp_alerts: []
    - eval_time: 15m
      alertname: StabilityPgSchemaGuessing
      exp_alerts:
      - exp_labels:
          severity: warning
        exp_annotations:
          summary: 有人在对生产库跑「猜出来的 schema」（或采集器停摆）
          description: PG 日志最近一小时内出现 ≥5 条 schema 猜测指纹（猜表名 / 猜列 / 枚举值大小写）——这类错误**正常路径不应产生**（2026-09-16 的现场是约
            30 条聚集：表名两个方向都猜错、枚举用大写、引用当时未落地的列）。真正的问题是无留痕：若哪次猜对了，就是一次不留审计痕迹的生产读写。先按 docs/operations/production-diagnostics.md
            的只读口径复核（SOP 首步已改为先查 information_schema 求证表名/列名/枚举），再用 pg_stat_activity 的 application_name 归因来源；后半段条件（last_run
            超 1 小时 / 指标消失）表示采集器停摆——那时计数恒 0，看起来像「没人在猜」。

  # ---- #2754 StabilityHostAdbOfflineConcentration ----
  # 构造三台 host：事故态（15/16 offline）、健康态（2/26）、噪声态（4/4 小 host 全掉线）。
  # host_id 用 RFC5737 TEST-NET-1 的合成值（192-0-2.x）——public 仓库不得写真实资产地址
  # （tools/dev/check-internal-ip-leak.py 的 host-id-dash 判据），形状与在册 host 一致即可。
  # 第三条是**故意的 not-fire 断言**——绝对下限 5 就是为它设的（当前 fleet 里 min=3），
  # 没有这条，把下限从 5 改成 1 也照样绿，阈值失去判别力。
  - interval: 1m
    input_series:
    - series: 'stability_host_device_adb_state{host_id="192-0-2-81", state="offline"}'
      values: '15x30'
    - series: 'stability_host_device_adb_state{host_id="192-0-2-81", state="device"}'
      values: '1x30'
    - series: 'stability_host_device_adb_state{host_id="192-0-2-60", state="offline"}'
      values: '2x30'
    - series: 'stability_host_device_adb_state{host_id="192-0-2-60", state="device"}'
      values: '24x30'
    - series: 'stability_host_device_adb_state{host_id="192-0-2-77", state="offline"}'
      values: '4x30'
    alert_rule_test:
    - eval_time: 10m
      alertname: StabilityHostAdbOfflineConcentration
      exp_alerts: []
    - eval_time: 25m
      alertname: StabilityHostAdbOfflineConcentration
      exp_alerts:
      - exp_labels:
          host_id: 192-0-2-81
          severity: warning
        exp_annotations:
          summary: Devices on one host are bulk adb-offline
          description: >-
            该 host 上 adb_state=offline 的设备已成多数（≥5 台且占比 ≥50%，持续 15m）。
            先按 docs/operations/production-diagnostics.md 的只读口径分清是哪一层：
            lsusb 设备在位 + adb server 存活 + `adb reconnect offline` 立即恢复 ⇒ adbd
            会话陈旧（#2754 的事故形态，非硬件）；lsusb 查无设备 ⇒ USB 枚举层，
            对照 docs/operations/incident-2026-07-29-host-8-87-xhci-death-and-adb-outage.md
            判据树。注意本告警**只观测**：平台侧自动 reconnect 未实现（会打断在跑的 job，
            需裁决，见 #2754 / #722）。

  # ---- #2909③ StabilityChainCoverageGap ----
  # 样本必须**覆盖到第二个 eval_time 之后**：series 在 t=59m 结束而 eval 在 65m，
  # 超过 Prometheus 的 5 分钟 staleness 窗口 ⇒ 表达式取空、`got:[]`
  # （promtool 3.13.3 报「exp 有 / got 空」；本机 2.53.3 容忍，见 #2970 的 Note）。
  - interval: 1m
    input_series:
      - series: 'stability_chain_coverage_devices{kind="online_total"}'
        values: '600x70'
      - series: 'stability_chain_coverage_devices{kind="gap_missing"}'
        values: '90x70'
    alert_rule_test:
      - eval_time: 59m
        alertname: StabilityChainCoverageGap
        exp_alerts: []
      - eval_time: 65m
        alertname: StabilityChainCoverageGap
        exp_alerts:
          - exp_labels:
              severity: warning
              domain: schedule
            exp_annotations:
              summary: 周期回归链的 fleet 覆盖差超 10%（存在结构性掉出清单的 ONLINE 设备）
              description: >-
                未退役 host 上 ONLINE 的设备中，>10% 不在任何 enabled task_schedule 的
                device_ids 清单里且持续 60m（分母下限 50 台防 fleet 缩容误报）。
                链清单是 放量时点的存储快照（schedule.device_ids 无再生成路径，
                链后续段只做 status 修剪不扩列——见 #2909 诊断），放量后接入/回潮
                的设备会永久离开周期观测面。排查：/metrics 的
                stability_chain_coverage_devices 三元组 + #2909 评论的定案 SQL 形态；
                处置在 #2909 问题②的裁决（动态派生或清单再生成），不是调高本阈值。

  # ---- #2909③ 反向：10% 以内不报（含 exactly 0.1） ----
  - interval: 1m
    input_series:
      - series: 'stability_chain_coverage_devices{kind="online_total"}'
        values: '600x70'
      - series: 'stability_chain_coverage_devices{kind="gap_missing"}'
        values: '60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: StabilityChainCoverageGap
        exp_alerts: []

  # ============================================================================
  # #2900 / #2957 —— host 级 USB 失明与「判据通道是否真的在跑」
  #
  # 三条刻意的 not-fire 断言（缺一条，对应阈值/选择器就失去判别力）：
  #   1. `for:` 窗口（3m 不亮主控死亡、40m 不亮链路劣化）——只抬时间窗不会无人知；
  #   2. 健康 host 的两条 reason 全 0（「从来没这个 reason」必须有基线 series，
  #      这也是 _refresh_host_health_gauges 里「全词表含 0 落值」那条口径的证据）；
  #   3. **只命中 link_degraded 的 host 不得点亮 controller_dead**（反之亦然）——
  #      这一条钉的是 `reason=` 标签选择器真的在起作用。删掉选择器，两台机器会同时
  #      亮两条告警：那正是 #1257「引用不存在的标签」的镜像形态（标签存在但没限定住）。
  # host_id 用 RFC5737 TEST-NET-1 合成值（public 仓库不得写真实资产地址）。
  # ----------------------------------------------------------------------------
  - interval: 1m
    input_series:
    - series: stability_host_health_reason{host_id="192-0-2-63", reason="usb_host_controller_dead"}
      values: 1x70
    - series: stability_host_health_reason{host_id="192-0-2-63", reason="usb_link_degraded"}
      values: '0x70'
    - series: stability_host_health_reason{host_id="192-0-2-102", reason="usb_host_controller_dead"}
      values: '0x70'
    - series: stability_host_health_reason{host_id="192-0-2-102", reason="usb_link_degraded"}
      values: 1x70
    - series: stability_host_health_reason{host_id="192-0-2-90", reason="usb_host_controller_dead"}
      values: '0x70'
    - series: stability_host_health_reason{host_id="192-0-2-90", reason="usb_link_degraded"}
      values: '0x70'
    alert_rule_test:
    - eval_time: 3m
      alertname: StabilityHostUsbControllerDead
      exp_alerts: []
    - eval_time: 10m
      alertname: StabilityHostUsbControllerDead
      exp_alerts:
      - exp_labels:
          severity: critical
          host_id: 192-0-2-63
          reason: usb_host_controller_dead
        exp_annotations:
          summary: Host USB controller is dead — the whole host is USB-blind
          description: 该 host 的内核报出 xHCI 主控死亡（`HC died; cleaning up`）**且此刻 USB 总线上 一台设备都看不到**。这不是 adb/adbd 问题：主控死了以后内核再也收不到任何 USB 事件，**不会自愈**，SSH 与心跳照常，平台侧只有这一条 reason 能表达它。 先按 docs/operations/host-device-visibility-triage.md 的 L1 层取证 （`journalctl -k | grep -E 'xhci|HC died'`），确认后用 unbind/rebind 救回 （fleet 已有两例当场恢复，23/23 设备回归），reboot 是兜底。 **不要自动 rebind**：会打断在跑的 job，自愈与否待本告警有数据后另议（#2900「不做什么」）。 这台机器的产能已归零，请把它从调度里摘掉再处理（设备租约见 device-lease-release SOP）。
    - eval_time: 40m
      alertname: StabilityHostUsbLinkDegraded
      exp_alerts: []
    - eval_time: 50m
      alertname: StabilityHostUsbLinkDegraded
      exp_alerts:
      - exp_labels:
          severity: warning
          host_id: 192-0-2-102
          reason: usb_link_degraded
        exp_annotations:
          summary: Chronic USB link errors on one host (pre-death signature)
          description: 该 host 最近一小时的内核日志里 USB 传输错误超阈（`error -71`/`error -110` 计数 ≥20，或 `Maybe the USB cable is bad?` ≥5）且持续 45m。**计数只取增量窗样本**：agent 重启时重跑的「整段 boot」累计不参与（#2978）——所以这条报的是「现在正在劣化」，不是「本 boot 曾经劣化」。这是**死亡前兆** 而不是死亡：#2900 的 .102 案例在 HC died 之前以每日 400~3700 行的速率风暴了 两周，全程零告警。窗口比主控死亡那条长（45m vs 5m），因为瞬态插拔抖动也会 命中阈值，而真实劣化会持续数小时到数天。处置：查线/查 hub 供电（SS 线松动、 劣质 hub、EMI 都是已知成因），别等它死——主控一死就只能 unbind/rebind。 同 host 若同时出现 StabilityHostUsbControllerDead，以那条为准（本条是前兆面）。
    - eval_time: 50m
      alertname: StabilityHostUsbControllerDead
      exp_alerts:
      - exp_labels:
          severity: critical
          host_id: 192-0-2-63
          reason: usb_host_controller_dead
        exp_annotations:
          summary: Host USB controller is dead — the whole host is USB-blind
          description: 该 host 的内核报出 xHCI 主控死亡（`HC died; cleaning up`）**且此刻 USB 总线上 一台设备都看不到**。这不是 adb/adbd 问题：主控死了以后内核再也收不到任何 USB 事件，**不会自愈**，SSH 与心跳照常，平台侧只有这一条 reason 能表达它。 先按 docs/operations/host-device-visibility-triage.md 的 L1 层取证 （`journalctl -k | grep -E 'xhci|HC died'`），确认后用 unbind/rebind 救回 （fleet 已有两例当场恢复，23/23 设备回归），reboot 是兜底。 **不要自动 rebind**：会打断在跑的 job，自愈与否待本告警有数据后另议（#2900「不做什么」）。 这台机器的产能已归零，请把它从调度里摘掉再处理（设备租约见 device-lease-release SOP）。
  # ----------------------------------------------------------------------------
  # StabilitySingleInstanceGuardDegraded（#3092）：守卫降级 = 锁文件连只读都打不开。
  # 两个断言面：
  #   1. 降级 host 在 for=10m 之前不点亮（瞬态/重启窗口不误报）；
  #   2. 同批健康 host（该 reason 恒 0）不得被选择器带上——钉 `reason=` 标签真的在起作用。
  # ----------------------------------------------------------------------------
  - interval: 1m
    input_series:
    - series: stability_host_health_reason{host_id="192-0-2-77", reason="single_instance_guard_degraded"}
