  # ---- #2957 通道覆盖面的两条 not-fire 钉子 ----
  # 只有 4 台 unavailable（绝对下限 5 未达）⇒ 不亮；
  # 6 台 unavailable + 11 台 unknown ⇒ 不亮（老 agent 未上报字段计入分母而不计入
  # 分子：升级期内既不会伪报「全 fleet 已覆盖」，也不会把「还没升」误判成「读不到」）。

  # ---- #2959 连接槽耗尽 / 池排队超时：真实 kind 标签各喂一条 ----
  # 样本用的 kind 值必须与 backend/core/metrics.py 的白名单一致，否则规则会"看着有场景、
  # 实际选了代码不会产出的标签值"（#1257 形态）。两条分别用 async / sync 侧，
  # 顺带钉住「alert 保留 engine 标签」——定位时要一眼看出是哪个池。
  - interval: 1m
    input_series:
    - series: stability_db_pool_checkout_failures_total{engine="async", kind="slots_exhausted"}
      values: 0+1x20
    - series: stability_db_pool_checkout_failures_total{engine="sync", kind="timeout"}
      values: 0+1x20
    alert_rule_test:
    - eval_time: 20m
      alertname: StabilityDbConnectionSlotsExhausted
      exp_alerts:
      - exp_labels:
          engine: async
          kind: slots_exhausted
          severity: warning
        exp_annotations:
          summary: PostgreSQL rejected new connections (too_many_connections, SQLSTATE 53300)
          description: 控制面取连接时收到 PG 拒绝新建连接。先分清占满槽的是谁：非超级用户可用 = max_connections − superuser_reserved（当前 100 − 3 = 97），而应用侧 sync/async 两个池各自上限 90、合计 180 已超过它（ADR-0047 D1/D2 未裁决）； 同机 ad-hoc 诊断会话与批量终态化波次（abort / 超时收尾）都是尖峰来源。 本告警只负责"发生过的没人知道"这件事，不代裁容量方向。 池内排队超时是另一条 StabilityDbPoolCheckoutTimeout。
    - eval_time: 20m
      alertname: StabilityDbPoolCheckoutTimeout
      exp_alerts:
      - exp_labels:
          engine: sync
          kind: timeout
          severity: warning
        exp_annotations:
          summary: SQLAlchemy QueuePool checkout timed out (pool saturated)
          description: 有请求在池内排队到 pool_timeout 仍没拿到连接。与上一条的区别是关键： 这条说明**池自身**已饱和（PG 未必满）；先查谁长期持有连接—— singleton 调度任务在长事务里取连接、或保留清理/NFS 回收这类慢 I/O 夹在 事务中间（#703 已修 leader election 一处，同类形态可再核）。 注意 pool_timeout 目前未显式设置（SQLAlchemy 默认 30s），所以触发时 调用方多半已经等了 30s：用户侧表现为卡顿而非快速失败，这是 ADR-0047 D2 要裁决的"失败形态"，不是本告警能替代的。
