    - series: stability_host_kernel_log_channel{host_id="192-0-2-25", state="ok"}
      values: 1x600
    alert_rule_test:
    - eval_time: 5h
      alertname: StabilityUsbKernelLogChannelDark
      exp_alerts: []
    - eval_time: 7h
      alertname: StabilityUsbKernelLogChannelDark
      exp_alerts:
      - exp_labels:
          severity: warning
        exp_annotations:
          summary: Kernel-log USB detector is structurally blind on most hosts
          description: '过半（且 ≥5 台）在册 host 的 agent **读不到内核日志**，因此 #2900 的 `usb_host_controller_dead` / `usb_link_degraded` 这两条判据在它们身上 **永远不会命中**——上面两条告警此时是绿的，但绿色不代表已覆盖。 出口由 #2957 裁决：给 agent 用户 `systemd-journal` 组（权限扩张，需签字， 且 48 台都要重跑安装步骤）、改用零权限的结果层判据（`usb_tree_empty`， #2902——其「DB 里本来有设备」合取已由下方 `StabilityHostUsbBlind`（#2967） 补上并接管失明 paging）、 或 sudoers 只放行 `journalctl -k -o cat` 这一条固定子命令（与 install_agent.sh 「提权面收敛为 wrapper 固定子命令」的先例同族）。 注意 `state="unknown"`（老 agent 未上报该字段）是**覆盖缺口**而不是本告警的 射程：它计入分母、不计入分子，避免 fleet 升级期间与 A/B/C 裁决混成一件事。'
  - interval: 10m
