    - eval_time: 15m
      alertname: StabilitySingleInstanceGuardDegraded
      exp_alerts:
      - exp_labels:
          severity: warning
          host_id: 192-0-2-77
          reason: single_instance_guard_degraded
        exp_annotations:
          summary: Single-instance guard degraded on one host (double-agent risk)
          description: 该 host 上 agent 的单实例锁文件**连只读都打不开**（典型：残留一个别的 属主的 0600 锁文件，或锁文件是符号链接），守卫因此降级为不生效—— 此刻若再有一个手工 `python -m agent.main` 起来，两个进程会各持不同 `agent_instance_id` 互相覆盖 `host.last_agent_instance_id`，coordinator fencing 对两者都判 stale，**该 host 的 Coordinator 心跳会被整条拒掉** （2026-07-27 事故：19/20 台被拒 3 天）。守卫的降级事实由心跳 `health.reasons` 上报，本告警就是它的响铃面。 处置：上机 `ls -l <agent>/logs/agent.lock`（LOG_DIR 下），确认属主/类型后 修掉（重新创建或改属主），再重启 agent 让守卫重新判定；期间该 host 别手工起第二个实例。只读回退（0644 root 文件）**不算降级**：那种情况下 守卫照常拦住第二个实例（只少写 pid），不会触发本告警。
  - interval: 1m
