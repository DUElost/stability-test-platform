  # ---- #2967 StabilityHostUsbBlind：结果层失明合取的三态 ----
  # fire：tree_empty ∧ 账上 12 台离线设备（.102 死亡窗离线回放形状）；
  # not-fire（钉子 1）：空柜机（.91 型）tree_empty 但设备零落账（无 adb_state series）；
  # not-fire（钉子 2）：热更重启瞬态 tick（.61 型，09-21 实测）空树 10min 后清除，
  #                    for:15m 吸收。eval_time:30m 的 exp_alerts 是对全体 host 的断言，
  #                    两台钉子机若误亮会连带 fire 断言一起红。
  - interval: 1m
    input_series:
    - series: stability_host_health_reason{host_id="192-0-2-102", reason="usb_tree_empty"}
      values: 1x600
    - series: stability_host_device_adb_state{host_id="192-0-2-102", state="offline"}
      values: 12x600
    - series: stability_host_health_reason{host_id="192-0-2-91", reason="usb_tree_empty"}
      values: 1x600
    - series: stability_host_health_reason{host_id="192-0-2-61", reason="usb_tree_empty"}
      values: 0x1 1x10 0x490
    - series: stability_host_device_adb_state{host_id="192-0-2-61", state="device"}
      values: 20x600
    alert_rule_test:
    - eval_time: 10m
      alertname: StabilityHostUsbBlind
      exp_alerts: []
    - eval_time: 30m
      alertname: StabilityHostUsbBlind
      exp_alerts:
      - exp_labels:
          severity: critical
          host_id: 192-0-2-102
          reason: usb_tree_empty
        exp_annotations:
          summary: Host USB is blind while the platform ledger still has devices on it
          description: "结果层判据（#2967：#2957 权限僵局期间的失明 paging）：agent 报 USB 树空 （lsusb 只剩 root hub ∧ 一台设备都没发现），但该 host 的 `device` 账上 仍有设备行——xHCI 主控死亡（`HC died`，不自愈）或 hub 供电/链路整体掉线 的形状。SSH 与心跳照常、产能静默归零（fleet 实测失明窗 7~11 天： 8.87 / .102 / .63）。处置：按 triage.md L1 取证——agent 通道恒 UNKNOWN （#2957），需 `sudo journalctl -k | grep -E 'xhci|HC died'`；空闲窗 （active_jobs=0）后用 xHCI unbind/rebind 救回（8.87 文档 §3.1； .63 实测 20s/23-23、.102 实测 20s/11-11），reboot 兜底。**不要自动 rebind**（门控自愈见 #2972，勿在告警处置里顺手做）。若确认该机柜已撤线 （设备行全是 ghost），清账关闭本告警，而不是给本规则加静音条件。"
  # ---- ADR-0038 v0.3 D9（#3159）：设备面意图豁免（unless）+ 意图陈旧（D9.8）----
  # host-emptied（192-0-2-31）：全信号与对照机相同，仅多一条 intent series ⇒
  #   unless 豁免生效，UsbBlind / OfflineConcentration 均不火；device=0 ⇒
  #   D9.8 也不火（意图与事实一致）。
  # host-live（192-0-2-32）：无 intent series ⇒ unless 不命中，两规则照常火
  #   ——豁免只在置位时存在（清除 = series 消失 = 回到本形态）。
  # host-stale（192-0-2-33）：intent 置位 ∧ 账上回场 device>0 ⇒ D9.8 在
  #   for:1h 后火（eval 70m）；20m 时仍在 for 窗内不火。
  - interval: 1m
    input_series:
    - series: stability_host_health_reason{host_id="192-0-2-31", reason="usb_tree_empty"}
      values: 1x80
    - series: stability_host_device_adb_state{host_id="192-0-2-31", state="offline"}
      values: 10x80
    - series: stability_host_device_intent{host_id="192-0-2-31", intent="emptied"}
      values: 1x80
    - series: stability_host_health_reason{host_id="192-0-2-32", reason="usb_tree_empty"}
      values: 1x80
    - series: stability_host_device_adb_state{host_id="192-0-2-32", state="offline"}
      values: 10x80
    - series: stability_host_device_intent{host_id="192-0-2-33", intent="emptied"}
      values: 1x80
    - series: stability_host_device_adb_state{host_id="192-0-2-33", state="device"}
      values: 3x80
    alert_rule_test:
    - eval_time: 20m
      alertname: StabilityHostUsbBlind
      exp_alerts:
      - exp_labels:
          severity: critical
          host_id: 192-0-2-32
          reason: usb_tree_empty
        exp_annotations:
          summary: Host USB is blind while the platform ledger still has devices on it
          description: "结果层判据（#2967：#2957 权限僵局期间的失明 paging）：agent 报 USB 树空 （lsusb 只剩 root hub ∧ 一台设备都没发现），但该 host 的 `device` 账上 仍有设备行——xHCI 主控死亡（`HC died`，不自愈）或 hub 供电/链路整体掉线 的形状。SSH 与心跳照常、产能静默归零（fleet 实测失明窗 7~11 天： 8.87 / .102 / .63）。处置：按 triage.md L1 取证——agent 通道恒 UNKNOWN （#2957），需 `sudo journalctl -k | grep -E 'xhci|HC died'`；空闲窗 （active_jobs=0）后用 xHCI unbind/rebind 救回（8.87 文档 §3.1； .63 实测 20s/23-23、.102 实测 20s/11-11），reboot 兜底。**不要自动 rebind**（门控自愈见 #2972，勿在告警处置里顺手做）。若确认该机柜已撤线 （设备行全是 ghost），清账关闭本告警，而不是给本规则加静音条件。"
    - eval_time: 20m
      alertname: StabilityHostAdbOfflineConcentration
      exp_alerts:
      - exp_labels:
          host_id: 192-0-2-32
          severity: warning
        exp_annotations:
          summary: Devices on one host are bulk adb-offline
          description: >-
            该 host 上 adb_state=offline 的设备已成多数（≥5 台且占比 ≥50%，持续 15m）。
            先按 docs/operations/production-diagnostics.md 的只读口径分清是哪一层：
            lsusb 设备在位 + adb server 存活 + `adb reconnect offline` 立即恢复 ⇒ adbd
            会话陈旧（#2754 的事故形态，非硬件）；lsusb 查无设备 ⇒ USB 枚举层，
            对照 docs/operations/incident-2026-07-29-host-8-87-xhci-death-and-adb-outage.md
            判据树。注意本告警**只观测**：平台侧自动 reconnect 未实现（会打断在跑的 job，
            需裁决，见 #2754 / #722）。
    - eval_time: 20m
      alertname: StabilityHostDeviceIntentStale
      exp_alerts: []
    - eval_time: 70m
      alertname: StabilityHostDeviceIntentStale
      exp_alerts:
      - exp_labels:
          host_id: 192-0-2-33
          severity: warning
        exp_annotations:
          summary: Devices are back on a host whose device-face intent says "emptied"
          description: "该 host 被人工置位了设备面意图（emptied），但账上重新出现 adb_state=device 的设备——设备回场 / 机柜重新上线，置位断言已陈旧（ADR-0038 v0.3 D9.8）。 请人工核实后清除意图（DELETE /api/v1/hosts/{id}/device-intent）；在清除前， UsbBlind / AdbOfflineConcentration 对该 host 的豁免仍然生效，真故障会被 静默——这正是本告警要兜住的路径。**不要**自动清除：意图由人维护。"
  # ---- #3046/#3068 StabilityHostAdbInterfacesMissing：L4 paging 两态 ----
  # fire：.65 同源——reason 持续 ≥30m（#3068 选型 2，短 for 会常亮）；
  # not-fire：短窗瞬态在 30m 前清除；eval 15m 仍在 for 内不火。
  - interval: 1m
    input_series:
    - series: stability_host_health_reason{host_id="192-0-2-65", reason="adb_interfaces_missing"}
      values: 1x45
    - series: stability_host_health_reason{host_id="192-0-2-20", reason="adb_interfaces_missing"}
      values: 0x1 1x1 0x43
    alert_rule_test:
    - eval_time: 15m
      alertname: StabilityHostAdbInterfacesMissing
      exp_alerts: []
    - eval_time: 35m
      alertname: StabilityHostAdbInterfacesMissing
      exp_alerts:
      - exp_labels:
          severity: warning
          host_id: 192-0-2-65
          reason: adb_interfaces_missing
        exp_annotations:
          summary: Host has USB devices but zero ADB interfaces (L4 — device-side only)
          description: "L4 判据（#3046/#3068 paging）：agent 报 `adb_interfaces_missing` （USB 枚举到设备，但 sysfs 上 ADB 接口 `ff:42` 数为 0）已持续 ≥30m。 这不是 adb server / xHCI 问题——设备 USB gadget 没暴露 ADB 接口时， `adb devices` 连 offline 都不会出现。处置：按 docs/operations/host-device-visibility-triage.md §1 L4——**设备侧人工** 把 USB 配置切回 MTP/文件传输并开启 USB 调试。**不要** `adb kill-server` / `adb start-server` / xHCI rebind（§4 对照实验已证无效；恢复自动化已撤回）。 fleet 同源形态：.65/.20 曾静默 HEALTHY 数周（合计 34 台设备）。 本告警接受「没人处理就一直亮」= 待办而非抢修事件（#3068）。"
  # ---- #2959 连接槽耗尽 / 池排队超时：真实 kind 标签各喂一条 ----
  # 样本用的 kind 值必须与 backend/core/metrics.py 的白名单一致，否则规则会"看着有场景、
  # 实际选了代码不会产出的标签值"（#1257 形态）。两条分别用 async / sync 侧，
  # 顺带钉住「alert 保留 engine 标签」——定位时要一眼看出是哪个池。
  - interval: 1m
    input_series:
    - series: stability_db_pool_checkout_failures_total{engine="async", kind="slots_exhausted"}
      values: 0+1x20
    - series: stability_db_pool_checkout_failures_total{engine="sync", kind="timeout"}
      values: 0+1x20
    alert_rule_test:
    - eval_time: 20m
      alertname: StabilityDbConnectionSlotsExhausted
      exp_alerts:
      - exp_labels:
          engine: async
          kind: slots_exhausted
          severity: critical
        exp_annotations:
          summary: PostgreSQL rejected new connections (too_many_connections, SQLSTATE 53300)
          description: 控制面取连接时收到 PG 拒绝新建连接。非超级用户可用 = max_connections − superuser_reserved − reserved_connections（当前 100 − 3 − 0 = 97）， 应用侧 sync/async 两池各自上限（默认 20+20）合计 80，已由启动期 check_db_pool_budget.py 硬校验（ADR-0047 D1）；本告警亮起说明该不变量被越过： 要么池参数被改大（门禁未生效/被绕过），要么 PG 侧上限被下调，要么同机 ad-hoc 会话（备份/迁移/人工 psql）吃掉了预留（STP_DB_CONNECTION_RESERVE）。 尖峰来源按 R523 实测是**批量终态化波次**（abort / 超时收尾，490 job → 1644 次 /complete）。终态侧已由独立舱壁削峰（StabilityTerminalBulkheadRejected）， 本告警此后应接近零——再亮就是上面三种形态之一，不是常态。 池内排队超时是另一条 StabilityDbPoolCheckoutTimeout。
    - eval_time: 20m
      alertname: StabilityDbPoolCheckoutTimeout
      exp_alerts:
      - exp_labels:
          engine: sync
          kind: timeout
          severity: warning
        exp_annotations:
          summary: SQLAlchemy QueuePool checkout timed out (pool saturated)
          description: 有请求在池内排队到 pool_timeout 仍没拿到连接。与上一条的区别是关键： 这条说明**池自身**已饱和（PG 未必满）；先查谁长期持有连接—— singleton 调度任务在长事务里取连接、或保留清理/NFS 回收这类慢 I/O 夹在 事务中间（#703 已修 leader election 一处，同类形态可再核）。 ADR-0047 v1.1 起 pool_timeout=2s（显式，不再是 SQLAlchemy 默认 30s）， 所以调用方等的是 2s 内的快失败（对外 503 + Retry-After，DB_OVERLOADED）； 触发说明**并发需求真的超过了池容量**（默认 20+20/引擎），而不是把卡顿 藏在 30s 的排队里。
  # ---- ADR-0047 D5：终态舱壁持续削峰（新增规则必须带场景，#2151 棘轮）--------
  # 2026-09-23 修正：判据从 `increase(...[5m]) > 0 for: 5m` 换成「最近 10 分钟里
  # ≥8 个一分钟窗口有拒绝」。两条场景分别钉住修正的两端——
  # ① 单次拒绝后长期静默：**不得** firing（原式在边界条件下会假阳）；
  # ② 持续 10 分钟拒绝：必须 firing。
  # 采样间隔 = 生产抓取间隔 15s（deploy/prometheus/prometheus.yml）。#3247：两组原为 1m 采样——
  # Prometheus 3.x 的区间选择器左开，1m 采样下 `increase(x[1m])` 窗口里只剩 1 个样本、恒无值：
  # 正向组在 CI 固定的 promtool 3.13 下失败，负向组则恒真通过（规则拿不到数据，空过）。
  # 本地 promtool 2.53 是闭区间，两组都「对」，所以只在 CI 暴露，且被前序步骤的失败遮蔽了两夜。
  - interval: 15s
    input_series:
    # 只在 75s→90s 之间发生一次拒绝（counter 0 → 1），此后长期不再增长。跳变刻意落在一分钟窗口
    # **内部**：3.x 左开窗口下，恰好跨在步长边界（如 60s→75s）的单次跳变对每个 increase[1m] 都
    # 不可见，负向断言会再次退化成空过（放宽阈值到 >= 0 也不红）。
    - series: stability_terminal_bulkhead_rejected_total
      values: 0x5 1x79
    alert_rule_test:
    # 边界：原式在 eval 6m 时 increase[5m] 仍 >0 且 for: 5m 刚满足 → 会假阳
    - eval_time: 6m
      alertname: StabilityTerminalBulkheadRejected
      exp_alerts: []
    - eval_time: 20m
      alertname: StabilityTerminalBulkheadRejected
      exp_alerts: []
  - interval: 15s
    input_series:
    # 每分钟都在拒绝（每 15s 采样 +0.25）⇒ 10 分钟窗内每个一分钟窗口都 >0
    - series: stability_terminal_bulkhead_rejected_total
      values: 0+0.25x84
    alert_rule_test:
    - eval_time: 12m
      alertname: StabilityTerminalBulkheadRejected
      exp_alerts:
      - exp_labels:
          severity: warning
        exp_annotations:
          summary: Terminal (/complete) bulkhead is shedding load persistently
          description: "/agent/jobs/{id}/complete 的并发舱壁在最近 10 分钟里有 ≥8 个一分钟窗口 在拒绝请求（默认 16 并发 / 等待预算 500ms）——这是**持续**削峰，不是一次 瞬态尖峰（单次拒绝只进指标，不报）。舱壁是**设计内的背压**（R523 之后 新增，ADR-0047 D2）：终态事实在 Agent 本地 SQLite outbox 里不会丢，峰值 过后由 outbox 补送，PlanRun 收敛会晚几十秒。 持续拒绝说明三点之一：① 设备规模 × 单批终态的到达率已经超过 16 （考虑按实测抬舱壁，并同步核对池预算）；② Agent 侧退避未生效（重试仍在 原地打转，见 #3242）；③ 舱壁之外的通道（heartbeat/steps/claim）被别的 慢查询拖住。 用 stability_terminal_bulkhead_inflight / _waiting 判断是「满负荷在跑」 还是「持名额的请求卡住了」。**本告警是诊断信号（非 paging）**； #3243 给出量级分布后，paging 条件应叠加 terminal outbox backlog / 终态收敛延迟 / 父 Run 长时间不终态，避免为「成功吸收的削峰」报警。"
  # #3217：Agent 上报的 crash artifact 丢失累计（Gauge 承载、按计数器语义读）。
  # host-1：5m 后 submit 与 post 两段出现丢失 → 两条告警各自点名 stage 触发；promote 恒 0 不触发；
  #         30m 时窗口内已无增量 → 告警恢复（事件型，不是一次丢失永久挂红）。
  # host-2：Agent 重启（累计 5 → 0）且之后无新丢失 → increase 按重置处理，不得误报。
  - interval: 1m
    input_series:
      - series: 'stability_agent_artifact_dropped{host_id="host-1",stage="submit"}'
        values: '0x5 3x30'
      - series: 'stability_agent_artifact_dropped{host_id="host-1",stage="post"}'
        values: '0x5 1x30'
      - series: 'stability_agent_artifact_dropped{host_id="host-1",stage="promote"}'
        values: '0x36'
      - series: 'stability_agent_artifact_dropped{host_id="host-2",stage="submit"}'
        values: '5x10 0x26'
    alert_rule_test:
      - eval_time: 12m
        alertname: StabilityAgentArtifactSubmitDropped
        exp_alerts:
          - exp_labels:
              host_id: host-1
              stage: submit
              severity: warning
            exp_annotations:
              summary: Agent dropped crash artifacts at submit (15m)
              description: "The Agent artifact uploader dropped submissions (queue full, uploader not running, or invalid payload).  Those crash artifacts are never registered: affected jobs look complete but lack evidence.  Check the host agent log for artifact_uploader_*_dropped and compare the crash burst with the queue depth; do not make the queue unbounded (#3217)."
      - eval_time: 12m
        alertname: StabilityAgentArtifactDeliveryFailed
        exp_alerts:
          - exp_labels:
              host_id: host-1
              stage: post
              severity: warning
            exp_annotations:
              summary: Agent failed to deliver crash artifacts (15m)
              description: "Crash artifacts were lost after submit: promote to the shared root failed (stage=promote) or the registration POST failed without retry (stage=post). Check the shared storage mount on that host first, then centre reachability and POST .../jobs/*/artifacts responses (#3217)."
      - eval_time: 30m
        alertname: StabilityAgentArtifactSubmitDropped
        exp_alerts: []

  # ── #3077：整窗 0 完成（warning / critical 由 level 标签区分）──────────────
  - interval: 1m
    input_series:
      - series: 'stability_plan_run_zero_output_total{level="warning"}'
        values: '0+1x20'
      - series: 'stability_plan_run_zero_output_total{level="critical"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: StabilityPlanRunZeroOutput
        exp_alerts:
          - exp_labels:
              level: warning
              severity: warning
            exp_annotations:
              summary: "Plan run finished with zero completions"
              description: "A plan run reached terminal state with total >= 20 jobs and 0 completed (#3077) — the execution chain ran but produced nothing (platform/script failure, not device failures). Inspect the run's jobs and agent health."
      - eval_time: 20m
        alertname: StabilityPlanRunZeroOutputConsecutive
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'stability_plan_run_zero_output_total{level="critical"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: StabilityPlanRunZeroOutputConsecutive
        exp_alerts:
          - exp_labels:
              level: critical
              severity: critical
            exp_annotations:
              summary: "Same plan produced zero completions two windows in a row"
              description: "Two consecutive terminal runs of the same plan finished with zero completions (#3077) — treat as a platform/script outage for that plan and check the fleet/agent side before re-running."

  # ── #3066 A半：链级断链可见性 ──────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'stability_plan_chain_visibility_gap_total{reason="parent_failed"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: StabilityPlanChainIncomplete
        exp_alerts:
          - exp_labels:
              reason: parent_failed
              severity: warning
            exp_annotations:
              summary: "Plan chain stopped with uncreated downstream segments"
              description: "A chain stopped at its current segment while downstream plan segments were never created (#3066; parent_failed / dispatch_failed / no_healthy_devices). Chain-break semantics unchanged (ADR-0048) — this makes the missing segments visible; see run_context.chain_visibility_gap_signaled for the stopped run."

  # ── #3341：post_completion 截止窗行 gauge（持续 >0 才告警，可读行排空即恢复）──
  - interval: 1m
    input_series:
      - series: 'stability_post_completion_cutoff_jobs'
        values: '0x5 3x25'
    alert_rule_test:
      - eval_time: 6m
        alertname: StabilityPostCompletionCutoffJobs
        exp_alerts: []
      - eval_time: 25m
        alertname: StabilityPostCompletionCutoffJobs
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Terminal jobs cut off past the post-completion defer window"
              description: "Terminal jobs whose finish detail is still unreadable beyond the post-completion defer cutoff stopped being re-enqueued (#3341); their reports were never persisted and need manual inspection. Readable cutoff rows are re-enqueued and will drain on their own."
