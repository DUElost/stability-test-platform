# 刷机前置归位（主机页入口 / #2133 / ADR-0037 D5）
#
# 与 update_agent.yml 的 opt-in 段同源：dialout + plugdev + MTK ttyACM 规则 + ModemManager 忽略规则
# + Android USB（adb/fastboot）节点规则（#3493）+ Qt/X 五库。
# 本 playbook **强制**执行（不依赖 agent_ensure_flash_prereqs 开关），供控制面
# POST /hosts/{id}/flash-prereqs/ensure 调用；常规热更新仍不触碰系统包面。
#
# 用法：
#   ansible-playbook tools/ansible/playbooks/ensure_flash_prereqs.yml -l <host>
#
# dialout/plugdev 变更后必须重启 Agent，否则进程组集合仍是旧的。
---
- name: Ensure flash prerequisites on agent host
  hosts: linux_hosts
  gather_facts: false
  become: false

  tasks:
    - name: Check dialout group exists (#2133)
      become: true
      ansible.builtin.command: getent group dialout
      register: agent_flash_dialout_group
      changed_when: false
      failed_when: false

    - name: Ensure agent user is in dialout group (#2133)
      become: true
      ansible.builtin.user:
        name: "{{ agent_user }}"
        groups: dialout
        append: true
      register: agent_flash_dialout
      failed_when: false
      when: agent_flash_dialout_group.rc | default(1) == 0

    - name: Check agent user is a dialout member (#2133/#2353)
      become: true
      ansible.builtin.shell: id -nG {{ agent_user }} | tr ' ' '\n' | grep -qx dialout
      register: agent_flash_dialout_member
      changed_when: false
      failed_when: false

    # #3493：adb/fastboot 的 usbfs 节点全集规则（插上本机即测试终端）；
    # 与 install_agent.sh §1.3/§4d 同源，形态判据同样是「是否已持久属于 plugdev」。
    - name: Check plugdev group exists (#3493)
      become: true
      ansible.builtin.command: getent group plugdev
      register: agent_flash_plugdev_group
      changed_when: false
      failed_when: false

    - name: Ensure agent user is in plugdev group (#3493)
      become: true
      ansible.builtin.user:
        name: "{{ agent_user }}"
        groups: plugdev
        append: true
      register: agent_flash_plugdev
      failed_when: false
      when: agent_flash_plugdev_group.rc | default(1) == 0

    - name: Check agent user is a plugdev member (#3493)
      become: true
      ansible.builtin.shell: id -nG {{ agent_user }} | tr ' ' '\n' | grep -qx plugdev
      register: agent_flash_plugdev_member
      changed_when: false
      failed_when: false

    - name: Ensure MTK ttyACM udev rule — 0660 + dialout (#2133/#2284)
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/98-ttyacm-mtk.rules
        content: "KERNEL==\"ttyACM*\", ATTRS{idVendor}==\"0e8d\", GROUP=\"dialout\", MODE=\"0660\"\n"
        owner: root
        group: root
        mode: "0644"
      register: agent_flash_udev_rule_0660
      failed_when: false
      when: agent_flash_dialout_member.rc | default(1) == 0

    - name: Ensure MTK ttyACM udev rule — 0666 fallback, not a dialout member (#2133/#2353)
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/98-ttyacm-mtk.rules
        content: "KERNEL==\"ttyACM*\", ATTRS{idVendor}==\"0e8d\", MODE=\"0666\"\n"
        owner: root
        group: root
        mode: "0644"
      register: agent_flash_udev_rule_0666
      failed_when: false
      when: agent_flash_dialout_member.rc | default(1) != 0

    # ADR-0040 D8 R2：ModemManager 忽略 MTK 设备（刷机期间防 MM 抢占 preloader/BROM 串口）——此前只由
    # 安装链从 agent/resources/flashtool 拷入厂商规则；资源层退役后改固定形态，与 install_agent.sh §4b
    # 及厂商原件（flashtool@1.2444.00.100 包根 99-ttyacms.rules）逐字一致。
    - name: Ensure ModemManager ignores MTK devices — 99-ttyacms.rules (ADR-0040 D8)
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-ttyacms.rules
        content: "ATTRS{idVendor}==\"0e8d\", ENV{ID_MM_DEVICE_IGNORE}=\"1\"\n"
        owner: root
        group: root
        mode: "0644"
      register: agent_flash_udev_mm_rule
      failed_when: false

    # #3493：Android USB（adb/fastboot）节点全集规则。0660+plugdev 为标准形态，
    # **只有成员**才写它；非成员退化为 0666。收窄出口（出现不可信本地用户时改
    # VID:PID 白名单）写在 install_agent.sh §4d 的规则文件注释里。
    - name: Ensure Android USB udev rule — 0660 + plugdev (#3493)
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/90-android.rules
        content: "SUBSYSTEM==\"usb\", ENV{DEVTYPE}==\"usb_device\", MODE=\"0660\", GROUP=\"plugdev\"\n"
        owner: root
        group: root
        mode: "0644"
      register: agent_flash_adb_rule_0660
      failed_when: false
      when: agent_flash_plugdev_member.rc | default(1) == 0

    - name: Ensure Android USB udev rule — 0666 fallback, not a plugdev member (#3493)
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/90-android.rules
        content: "SUBSYSTEM==\"usb\", ENV{DEVTYPE}==\"usb_device\", MODE=\"0666\"\n"
        owner: root
        group: root
        mode: "0644"
      register: agent_flash_adb_rule_0666
      failed_when: false
      when: agent_flash_plugdev_member.rc | default(1) != 0

    - name: Reload udev rules after rule change (#2133)
      become: true
      ansible.builtin.command: udevadm control --reload
      changed_when: false
      failed_when: false
      when: >-
        (agent_flash_udev_rule_0660.changed | default(false))
        or (agent_flash_udev_rule_0666.changed | default(false))
        or (agent_flash_udev_mm_rule.changed | default(false))
        or (agent_flash_adb_rule_0660.changed | default(false))
        or (agent_flash_adb_rule_0666.changed | default(false))

    # #3493 勘误：reload 只重载规则库，**已插设备的节点不会重算**——.58 实测
    # （2026-09-29）规则落盘后 /dev/bus/usb/* 仍 root:root 0664、adb 仍 no
    # permissions。ttyACM 时代靠设备重枚举掩盖了这一点；本规则的目的恰是修
    # 「已插着」的设备。trigger 因此**无条件执行**（不门控在本轮 changed 上）：
    # 二轮实测发现规则文件已在（首轮落盘、copy 全 no-op）而设备仍是旧节点时，
    # 按 changed 门控会把 trigger skip 掉——那正是本 playbook 最要修的状态。
    # uevent 重放只重应用规则（幂等），不复位设备、不断开连接。
    - name: Trigger udev to re-apply rules on plugged devices (#3493)
      become: true
      ansible.builtin.command: udevadm trigger
      changed_when: false
      failed_when: false

    - name: Ensure flash prerequisite packages (#2133)
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        pkg_installed() {
          [ "$(dpkg-query -W -f='${Status}' "$1" 2>/dev/null)" = "install ok installed" ]
        }
        if ! command -v dpkg-query >/dev/null 2>&1; then
          echo "SKIP: non-dpkg host"; exit 0
        fi
        missing=""
        for pkg in {{ agent_flash_prereq_packages | join(' ') }}; do
          if ! pkg_installed "$pkg"; then
            case "$pkg" in
              *-0) pkg_installed "${pkg}t64" || missing="$missing $pkg" ;;
              *) missing="$missing $pkg" ;;
            esac
          fi
        done
        if [ -z "$missing" ]; then echo "OK: flash prereq packages present"; exit 0; fi
        DEBIAN_FRONTEND=noninteractive apt-get update -qq >/dev/null 2>&1 || true
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $missing
        echo "INSTALLED:$missing"
      args:
        executable: /bin/bash
      register: agent_flash_prereq_pkgs
      changed_when: "'INSTALLED:' in agent_flash_prereq_pkgs.stdout"
      failed_when: false

    - name: Restart agent after group membership change (#2133/#3493)
      become: true
      ansible.builtin.command: /usr/local/sbin/stp-agent-priv restart
      register: agent_flash_restart
      failed_when: false
      when: >-
        (agent_flash_dialout.changed | default(false))
        or (agent_flash_plugdev.changed | default(false))

    - name: Report flash prerequisite provisioning result (#2133/#2353/#3493)
      ansible.builtin.debug:
        msg: >-
          flash prereqs: dialout_member_rc={{ agent_flash_dialout_member.rc | default('n/a') }}
          (0=member) dialout_changed={{ agent_flash_dialout.changed | default(false) }}
          dialout_usermod_failed={{ agent_flash_dialout.failed | default(false) }}
          plugdev_member_rc={{ agent_flash_plugdev_member.rc | default('n/a') }}
          (0=member) plugdev_changed={{ agent_flash_plugdev.changed | default(false) }}
          udev_rule_changed={{ (agent_flash_udev_rule_0660.changed | default(false))
          or (agent_flash_udev_rule_0666.changed | default(false)) }}
          adb_rule_changed={{ (agent_flash_adb_rule_0660.changed | default(false))
          or (agent_flash_adb_rule_0666.changed | default(false)) }}
          mm_ignore_rule_changed={{ agent_flash_udev_mm_rule.changed | default(false) }}
          packages_rc={{ agent_flash_prereq_pkgs.rc | default('n/a') }}
          packages_out={{ agent_flash_prereq_pkgs.stdout_lines | default([]) | join(' | ') }}
          agent_restarted={{ agent_flash_restart.rc is defined }}
          agent_restart_rc={{ agent_flash_restart.rc | default('skipped') }}
