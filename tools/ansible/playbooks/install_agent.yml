# #2095：装机即对齐主机时区（与控制面一致的 Asia/Shanghai）。
# 刻意放在安装 play **之前**：装机脚本最后会重启 Agent 服务，届时新进程直接采用新时区，
# 无需再单独重启（长驻进程不会因 /etc/localtime 变化而重读时区，见 set_timezone.yml 注释）。
# 注意：本 play 的 host 组默认 linux_hosts；用其它 inventory 时以 -e tz_hosts=<group> 指定。
- import_playbook: set_timezone.yml

- name: Install linux agent host via phase-a bridge
  hosts: linux_hosts
  gather_facts: false

  pre_tasks:
    - name: Validate agent_secret is available
      ansible.builtin.assert:
        that:
          - agent_secret is defined
          - agent_secret | length >= 16
          - agent_secret != "REPLACE_WITH_VAULTED_SECRET_AT_LEAST_16_CHARS"
        fail_msg: >-
          agent_secret 未注入或仍为占位值。请确认仓库根 .env.backend 中存在
          AGENT_SECRET（至少 16 字符），或通过环境变量 AGENT_SECRET /
          vault_agent_secret 覆盖后重试。

    # install_agent.sh 自本切片起为非交互模式：API_URL 只能由调用方注入。
    # 控制面驱动安装（POST /hosts/{id}/install）注入 STP_AGENT_INSTALL_API_URL，
    # 手工安装请显式 -e agent_api_url=https://<控制面>。assert 是控制器侧
    # 动作，不建连接即失败（fail-closed），避免连上目标机后再因空地址中止。
    - name: Validate agent_api_url is injected
      ansible.builtin.assert:
        that:
          - agent_api_url is defined
          - agent_api_url | length > 0
          - agent_api_url.startswith('http://') or agent_api_url.startswith('https://')
        fail_msg: >-
          agent_api_url 未注入或不是 http(s) 地址，安装中止：非交互安装无法
          再从终端读取 API 地址。控制面请配置 STP_AGENT_INSTALL_API_URL；
          手工执行请加 -e agent_api_url=https://<控制面公开入口>。

  tasks:
    # 注意：**不要**在此设置 owner/group——Agent 服务账号由 install_agent.sh
    # 第 1 步创建，全新主机上此时还不存在（chown 会以
    # "failed to look up user android" 直接中断安装）。暂存树以 root 落地，
    # 脚本随后以 root 复制到 INSTALL_DIR 并统一改属主。
    - name: Ensure remote temp directory exists
      become: true
      ansible.builtin.file:
        path: "{{ agent_remote_tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Copy agent source tree to remote temp directory
      ansible.builtin.copy:
        src: "{{ agent_source_dir }}/"
        dest: "{{ agent_remote_tmp_dir }}/"
        mode: preserve

    - name: Ensure schema staging directory exists
      ansible.builtin.file:
        path: "{{ agent_remote_tmp_dir }}/stp_schemas"
        state: directory
        mode: "0755"

    - name: Stage pipeline schema for install script
      ansible.builtin.copy:
        src: "{{ stp_repo_root }}/backend/schemas/pipeline_schema.json"
        dest: "{{ agent_remote_tmp_dir }}/stp_schemas/pipeline_schema.json"
        mode: "0644"

    - name: Normalize line endings in staged source tree
      become: true
      ansible.builtin.shell: |
        find "{{ agent_remote_tmp_dir }}" -type f \( -name "*.sh" -o -name "*.py" \) -exec sed -i 's/\r$//' {} +
      changed_when: false

    # 非交互安装：安装脚本从环境变量读取参数（不再 printf 喂 read）。
    # AGENT_HOST_ID 为空时脚本回退按本机 IP 生成（手工安装路径）；
    # AGENT_NFS_ROOT / AGENT_LOCAL_AEE_ROOT 为空则不写 .env、不覆盖既有值。
    # AEE 本地根与共享挂载点由安装脚本创建（脚本才知道运行账号，且要在服务启动前
    # 就绪）——此处只负责挂载，见下方 #2181 段。
    - name: Run install script non-interactively
      become: true
      ansible.builtin.command:
        cmd: bash install_agent.sh
        chdir: "{{ agent_remote_tmp_dir }}"
      environment:
        AGENT_INSTALL_DIR: "{{ agent_install_dir }}"
        AGENT_USER: "{{ agent_user }}"
        AGENT_GROUP: "{{ agent_group }}"
        AGENT_SECRET: "{{ agent_secret }}"
        AGENT_CODE_VERSION: "{{ agent_code_version | default('', true) }}"
        PIP_INDEX_URL: "{{ agent_pip_index_url | default('') }}"
        AGENT_API_URL: "{{ agent_api_url }}"
        AGENT_HOST_ID: "{{ agent_host_id | default('', true) }}"
        AGENT_NFS_ROOT: "{{ agent_nfs_root | default('', true) }}"
        AGENT_LOCAL_AEE_ROOT: "{{ agent_local_aee_root | default('', true) }}"

    # ── 中心存储挂载（#2181）─────────────────────────────────────────────
    # 安装脚本已建好挂载点，这里把站点导出的子树挂上并持久化。挂载失败只降级为
    # 提示——Agent 用本地落点仍可运行，S5 的存储断言会如实报 FAIL，不在这里掩盖。
    - name: Check whether the central share is already mounted
      become: true
      when: agent_nfs_root | default('') | length > 0
      ansible.builtin.command: "findmnt -no SOURCE {{ agent_nfs_root }}"
      register: stp_nfs_check
      changed_when: false
      failed_when: false

    - name: Mount the central share (best effort; the local fallback still works)
      become: true
      when:
        - agent_nfs_root | default('') | length > 0
        - agent_nfs_server | default('') | length > 0
        - stp_nfs_check.rc | default(1) != 0
      ansible.builtin.command: "mount -t nfs -o rw {{ agent_nfs_server }}:{{ agent_nfs_root }} {{ agent_nfs_root }}"
      register: stp_nfs_mount
      failed_when: false

    # 只持久化真的挂上的导出：给"从没通"的分享写 fstab 会留下永远失败的开机挂载；
    # nofail 只保证 boot 不依赖它，不保证这条记录本身是对的。
    - name: "Persist the central share (nofail: boot must not depend on it)"
      become: true
      when:
        - agent_nfs_server | default('') | length > 0
        - (stp_nfs_check.rc | default(1) == 0) or (stp_nfs_mount.rc | default(1) == 0)
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^{{ agent_nfs_server }}:{{ agent_nfs_root }} "
        line: "{{ agent_nfs_server }}:{{ agent_nfs_root }} {{ agent_nfs_root }} nfs rw,nofail,_netdev 0 0"
        state: present

    - name: Report when the central share is unavailable
      become: true
      when:
        - agent_nfs_root | default('') | length > 0
        - (stp_nfs_check.rc | default(1) != 0)
        - (stp_nfs_mount.rc | default(1) != 0)
      ansible.builtin.debug:
        msg: >-
          Central share not mounted ({{ agent_nfs_server | default('server not provided') }}:{{ agent_nfs_root }});
          the Agent keeps running with the local root {{ agent_local_aee_root | default('(undeclared)') }}.
          S5 reports this as install.s5.storage FAIL until the share is reachable.

    - name: Refresh agentctl command from staged source
      become: true
      ansible.builtin.copy:
        remote_src: true
        src: "{{ agent_remote_tmp_dir }}/agentctl.sh"
        dest: "{{ agent_install_dir }}/agentctl"
        mode: "0755"

    - name: Refresh /usr/local/bin/agentctl symlink
      become: true
      ansible.builtin.file:
        src: "{{ agent_install_dir }}/agentctl"
        dest: "/usr/local/bin/agentctl"
        state: link

    - name: Repair ownership on install directory
      become: true
      ansible.builtin.file:
        path: "{{ agent_install_dir }}"
        owner: "{{ agent_user }}"
        group: "{{ agent_group }}"
        recurse: true

    - name: Ensure environment file ownership and mode
      become: true
      ansible.builtin.file:
        path: "{{ agent_install_dir }}/.env"
        owner: "{{ agent_user }}"
        group: "{{ agent_group }}"
        mode: "0640"

    - name: Restart agent service to load updated .env
      become: true
      ansible.builtin.systemd:
        name: "{{ agent_service_name }}"
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Verify service is active after install
      become: true
      ansible.builtin.command: "systemctl is-active {{ agent_service_name }}"
      register: agent_service_after_install
      changed_when: false
      retries: 12
      delay: 5
      until: agent_service_after_install.stdout == "active"

    - name: Run agentctl health after install
      become: true
      ansible.builtin.command: "{{ agent_agentctl_path }} health"
      register: agent_health_after_install
      changed_when: false
      retries: 6
      delay: 5
      until: agent_health_after_install.rc == 0

    # ── ADR-0040 D2/P2：全新安装也要落部署身份 ────────────────────────────
    # 热更新通道在健康收敛后写 ARTIFACT_DIGEST(_RESOURCES)；安装通道此前不写，
    # 于是站点侧只能看到空摘要——内容一致性无法断言（S5 会如实报
    # agent_digest_missing，而不是静默通过）。摘要按与热更新相同基准在控制机
    # 计算（源码树 + schema arcname），保证两种通道身份可直接比较。
    - name: Compute deployment artifact digests (ADR-0040 P2)
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: >-
          python3 {{ stp_repo_root }}/tools/ansible/compute_deploy_digest.py
          --source-dir {{ agent_source_dir }}
          --schema-file {{ stp_repo_root }}/backend/schemas/pipeline_schema.json
      register: agent_deploy_digests
      changed_when: false

    - name: Extract deployment digests
      ansible.builtin.set_fact:
        agent_code_artifact_digest: "{{ agent_deploy_digests.stdout | regex_search('CODE_DIGEST=(\\S+)', '\\1') | first }}"
        agent_resources_artifact_digest: "{{ agent_deploy_digests.stdout | regex_search('RESOURCES_DIGEST=(\\S*)', '\\1') | first }}"

    - name: Write agent ARTIFACT_DIGEST (ADR-0040 D2)
      become: true
      ansible.builtin.copy:
        content: "{{ agent_code_artifact_digest }}\n"
        dest: "{{ agent_install_dir }}/agent/ARTIFACT_DIGEST"
        owner: "{{ agent_user }}"
        group: "{{ agent_group }}"
        mode: "0644"
      when: agent_code_artifact_digest | length > 0

    - name: Write agent ARTIFACT_DIGEST_RESOURCES (ADR-0040 P2)
      become: true
      ansible.builtin.copy:
        content: "{{ agent_resources_artifact_digest }}\n"
        dest: "{{ agent_install_dir }}/agent/ARTIFACT_DIGEST_RESOURCES"
        owner: "{{ agent_user }}"
        group: "{{ agent_group }}"
        mode: "0644"
      when: agent_resources_artifact_digest | length > 0

    - name: Print install summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          service_state: "{{ agent_service_after_install.stdout | default('unknown') }}"
          health_rc: "{{ agent_health_after_install.rc | default('skipped') }}"
          api_url: "{{ agent_api_url }}"
          install_dir: "{{ agent_install_dir }}"
