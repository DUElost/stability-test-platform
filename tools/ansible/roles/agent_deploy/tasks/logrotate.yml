---
# #2205 / #2218：agent 进程日志轮转——**共享 task**（配置类变更）。
# 经两条通道 include：
#   - update_agent.yml（linux_hosts，14 台部署面；include 处带 tags: [logrotate]）
#   - configure_agents.yml（agent_config，48 台配置面）
# 主机未预装 logrotate（2026-09-15 canary 实测 `logrotate: not found`）——先装包，
# 随 Debian cron.daily 的 logrotate 定时器生效。
# **tag 必须写在各 task 上**：include 处的 tags 在本环境（ansible-core 2.19）
# 不会传播到 included tasks——2026-09-16 真跑实测 `--tags logrotate` 只跑 include
# 本身（ok=1）；显式标注后恢复（ok=2）。
- name: Ensure logrotate is installed (#2205)
  become: true
  tags: ["logrotate"]
  ansible.builtin.apt:
    name: logrotate
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: agent_logrotate_install

# **必须 copytruncate**：systemd 以 `StandardError=append:` 持有该文件 fd，
# 默认 create 模式（rename + 新建）会让 systemd 继续写已改名的旧文件、轮转
# 静默失效；copytruncate（copy + 截断原文件）才能保 fd 有效。去 delaycompress：
# 首轮即压缩（否则首轮 .1 保持未压缩、GB 级常驻）。
# 只配置、不主动执行轮转——首轮由 logrotate 定时器按 size/daily 自然触发。
- name: Configure agent log rotation (#2205)
  become: true
  tags: ["logrotate"]
  ansible.builtin.copy:
    dest: /etc/logrotate.d/stp-agent
    owner: root
    group: root
    mode: "0644"
    content: |
      # 由 Ansible 下发（#2205 / #2218）——勿手工编辑，重新部署会覆盖。
      # copytruncate：systemd append: 持 fd，create 模式会让轮转静默失效。
      {{ agent_install_dir }}/logs/agent_error.log {{ agent_install_dir }}/logs/agent.log {
          daily
          size {{ agent_logrotate_size | default('200M') }}
          rotate {{ agent_logrotate_rotate | default(7) }}
          compress
          copytruncate
          missingok
          notifempty
      }
