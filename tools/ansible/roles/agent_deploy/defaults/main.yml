agent_allowed_service_actions:
  - start
  - stop
  - restart
  - status

# 注：logrotate 变量（#2205）不在本文件——`--tags logrotate` 局部执行会跳过
# pre_tasks 的 include_vars 加载（2026-09-15 铺开实测 undefined），故放
# group_vars/linux_hosts.yml（恒加载，不受 tags 影响），见该文件同名注释。

agent_install_excludes:
  - "__pycache__/"
  # ADR-0051 Phase 3：脚本走包分发（tools_cache），不再随源码树同步
  - "scripts/"
  # ADR-0040 P2（#1997）：与部署 digest 输入集契约对齐——源码测试统一
  # test_*.py 宽模式（热更新打包同规则）；venv//logs/ 为宿主侧目录，
  # 源树出现时也不同步。
  - "test_*.py"
  - "tests/"
  - "venv/"
  - "logs/"
  - "install_agent.sh"
  - "agentctl.sh"
  - "DEPLOY.md"
  - ".env.example"
  - "stability-test-agent.service"
  - "hosts.txt"
  # 提权 wrapper 由 install/update playbook 装到 /usr/local/sbin（#1250），
  # 不随代码同步进 Agent 可写的安装目录
  - "stp_agent_priv.py"
  # #2030：排除集**单一源 = 契约包**（backend/agent/contracts/artifact_digest.py::
  # PAYLOAD_EXCLUDES，tar/digest 直接引用）；本表与 wrapper FIXED_EXCLUDES 因
  # 「YAML 数据 / 单文件脚本」无法 import Python，仍是拷贝——三处一致由
  # tests/test_ansible_digest_contract.py 锁定，追加项必须三处同改。
  - "*.pyc"
  - "stp_schemas/"
  - ".deps_installed_sha"

# 主机本地路径：升级同步策略 = 不传输 + 不删除（#1248）。
#
# ADR-0040 D8 R2：`resources/` **整树**归主机本地——host-resources 层已退役
# （flashtool / AIMonkey 改由 ADR-0051 D7 工具包承接），Ansible 不再下发它，也不得删它：
# 主机上的存量副本与 `resources/mtbf/`（手工布放的 MTBF APK 三件套）原样保留，退役不做
# 主机清理。副作用正是 #2166 想要的安全性：从**任何**源树（含没有 resources 的 git
# worktree）同步都不会再清空主机资源面（#2133 事故形态），源树断言随之撤除。
#
# 两个 flag 必须成对出现：`--exclude` 单独用会被 `--delete-excluded`
# 当作「可删的排除项」清掉（#1248 根因）；只发 protect 则挡不住
# 源目录同名文件覆盖主机本地版本。
agent_host_local_paths:
  - "resources/"
  # ADR-0040 D2（#1997）：部署身份文件——host 级状态，rsync --delete 不得
  # 清掉（清掉即心跳丢 current → 控制面误判 drift 多做一次全量）。写入由
  # 本 playbook 在 health 通过后显式完成。
  - "ARTIFACT_DIGEST"
  - "ARTIFACT_DIGEST_RESOURCES"
