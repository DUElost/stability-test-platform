# 注：ansible_become* / agent_install_dir / agent_logrotate_* 等跨面共享变量
# 已移至 group_vars/all.yml（#2218：linux_hosts 部署面 + agent_config 配置面共用）。

agent_check_strict: true
agent_status_require_active: true

# Agent 回连控制平面 Nginx 入口（:80），不直连 backend loopback :8000。
# UI/CLI 触发安装时可用 -e agent_api_url=... 临时覆盖。
# 本文件不再内置任何地址默认值：部署/更新必须通过 -e agent_api_url 或
# vault 提供真实控制面地址，否则 install_agent.sh 会因 API_URL 为空而失败。
agent_api_url: ""
agent_service_name: "stability-test-agent"
agent_remote_tmp_dir: "/tmp/stability-test-agent-ansible"
agent_user: "android"
agent_group: "android"
# UI 触发安装时由 saq_tasks 通过 -e agent_host_id=<UUID> 注入，使 agent 心跳
# 能匹配 DB host 记录。手动跑 playbook 不传则回退 install_agent.sh 自动生成。
agent_host_id: ""
agent_auto_register_host: false
agent_poll_interval: 10
agent_adb_path: "adb"
agent_log_level: "INFO"
# Agent 端 AEE 存储路径（安装时写入 .env）。
# 空值 = 不写、且不覆盖目标 .env 中既有非空值——两项语义不同：
#   STP_AEE_NFS_ROOT   中心存储挂载点，通常由控制面 fleet 键热更新下发，
#                      此处仅作首次安装兜底（值须与站点 storage.mount_path 一致）。
#   STP_AEE_LOCAL_ROOT 机器本地 HDD 第一落点，布局随机型而异，热更新不覆盖，
#                      站点安装由 install_options.agent_local_aee_root 显式指定。
agent_nfs_root: ""
agent_local_aee_root: ""
agent_health_log_tail_lines: 40
agent_agentctl_path: "{{ agent_install_dir }}/agentctl"
agent_source_dir: "{{ playbook_dir }}/../../../backend/agent"
# 升级门禁（#1249）：有活跃 Job 时默认拒绝升级（409）；置 true 允许先走
# abort 排空协议（释放租约 → Agent 收尾 → 终态）再占用维护窗口。
agent_abort_running_jobs: false
# 门禁请求超时（秒）。abort 排空最长约 45s（HOT_UPDATE_ABORT_POLL_TIMEOUT_SECONDS），
# 默认留足余量。
agent_upgrade_gate_timeout: 90
# 控制面仓库 HEAD 短 SHA：经 install_agent.sh 的 AGENT_CODE_VERSION 写入
# $INSTALL_DIR/agent/VERSION（与 API 热更新的 code_version 同语义）；git 不可用
# 时为空串，脚本跳过写入（不阻断安装）。#1247
agent_code_version: >-
  {{ lookup('pipe', 'git -C ' ~ stp_repo_root ~ ' rev-parse --short HEAD 2>/dev/null || true') | trim }}

# pip 镜像地址（热更新 requirements.txt 变化时使用）。空则用 pip 默认 index。
# 优先级：-e agent_pip_index_url=... > 环境变量 STP_AGENT_PIP_INDEX_URL > 空。
agent_pip_index_url: "{{ lookup('ansible.builtin.env', 'STP_AGENT_PIP_INDEX_URL') | default('', true) }}"

# Agent-Backend 双向认证密钥。
# 覆盖优先级：有效 vault_agent_secret > 本机环境变量 AGENT_SECRET > 仓库根 .env.backend。
# 这样测试环境无需手动传 vault，也避免把真实 secret 写入被 git 跟踪的文件。
#
# **兜底源必须是仓库根 .env.backend**（systemd EnvironmentFile，生产唯一 env 源），
# 不是 backend/.env。2026-08-01 实测两者的 AGENT_SECRET 不同，而控制面与全部
# 20 台 Agent 用的都是 .env.backend 那个 —— 从 backend/.env 兜底会把一个没人认的
# 密钥写进每台 Agent 的 .env，导致它们集体 SocketIO 认证失败。
agent_secret_placeholder_values:
  - ""
  - "REPLACE_WITH_VAULTED_SECRET_AT_LEAST_16_CHARS"

agent_secret_from_vault: "{{ vault_agent_secret | default('', true) | trim }}"
agent_secret_from_env: "{{ lookup('ansible.builtin.env', 'AGENT_SECRET') | default('', true) | trim }}"
# 锚定 playbook_dir 而不是 inventory_dir：真实 inventory 常放在仓库外
# （如 /home/debian13/hosts.ini），那时 inventory_dir 相对路径会指到仓库外，
# 兜底静默失效。playbook_dir 恒为 <repo>/tools/ansible/playbooks。
# 需要时用 -e stp_repo_root=/path/to/repo 覆盖。
stp_repo_root: "{{ (playbook_dir ~ '/../../..') | realpath }}"
agent_secret_from_env_backend: >-
  {{
    lookup(
      'ansible.builtin.ini',
      'AGENT_SECRET type=properties file=' ~ stp_repo_root ~ '/.env.backend',
      errors='ignore'
    ) | default('', true) | trim
  }}
agent_secret: >-
  {{
    agent_secret_from_vault
    if agent_secret_from_vault not in agent_secret_placeholder_values
    else (
      agent_secret_from_env
      if agent_secret_from_env not in agent_secret_placeholder_values
      else agent_secret_from_env_backend
    )
  }}

# ── 刷机前置归位（#2133 / ADR-0037 D5）────────────────────────────────────
# 运行期不再装包/加组（flash_preflight v1.0.2 只检不修）；由 update_agent.yml
# 的 provisioning 段在显式开启时补齐：dialout + 固定 udev 0666 规则 + 包集合。
# 默认 false：常规更新不触碰系统包面；刷机主机用
#   ansible-playbook ... update_agent.yml -l <hosts> -e agent_ensure_flash_prereqs=true
agent_ensure_flash_prereqs: false

# ── 源树 resources 前置断言（#2166）──────────────────────────────────────
# update_agent.yml 以 rsync --delete 同步 agent 树；resources/（230MB）不在 git，
# 任何 worktree 都没有它——源树缺失会把主机侧 agent/resources/ 清空（#2133 事故）。
# 默认 false：源树缺 resources/flashtool 入口即拒绝（fail 在同步之前）。
# 仅"确要清空主机资源面"时显式 -e agent_allow_empty_resources=true 放行。
agent_allow_empty_resources: false
# flash_tool 依赖的 Qt/X 运行库（与 flash_preflight._DEFAULT_PACKAGES 同源，
# 由 tests/test_flash_provisioning_prereqs_2133.py 锁定一致性）。
agent_flash_prereq_packages:
  - libice6
  - libsm6
  - libxrender1
  - libfontconfig1
  - libglib2.0-0

# 进程日志轮转（#2205）变量已移至 group_vars/all.yml（#2218：两面共享）。
